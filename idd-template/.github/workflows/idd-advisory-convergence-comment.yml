# Non-required companion to idd-advisory-convergence.yml (#2136, #2411).
#
# Human review-thread and regular-comment chatter must not create or
# cancel the required `idd-advisory-convergence` check-run. This
# workflow has a different name, job id, and concurrency group so it
# cannot overwrite that SHA verdict or cancel an in-flight required run.
#
# When the comment is IDD-originated (reply-identity stamp, disposition
# prefix, or an operational marker the required check already honors),
# it reuses `rerun-advisory-convergence.mjs --apply` to refresh the
# existing pull_request-family required run for the current HEAD SHA.
# It never asserts `ready` itself.
#
# Two trigger families land here (#2411): `pull_request_review_comment`
# (inline review-thread comments) and `issue_comment` (regular PR
# comments -- where post-idd-marker.mjs and
# disposition-non-review-notices.mjs actually post every marker/
# disposition type, since both use the issues-comments API).
# `issue_comment` also fires for a comment on a plain issue, not only a
# PR; the job-level `if:` below skips those (`github.event.issue.pull_request`
# is only present when the commented-on issue is a PR).
#
# Job id is deliberately NOT `idd-advisory-convergence`.
#
# Runner: shipped default is `ubuntu-slim`. Override via the
# `CI_RUNNER_LABEL` repository variable, matching the required
# workflow. `defaults.run.shell` pins every `run:` step to `bash`.
#
# Profile resolution: mirrors post-merge-cleanup.yml's
# helperRuntime.profile resolution and per-step `if:` gating. Unlike
# the required idd-advisory-convergence.yml companion, an
# `instructions-only` profile here simply skips the classify/rerun
# steps -- this workflow is a best-effort refresh, not the merge-gate
# verdict itself, so silently doing nothing on every review comment is
# harmless. The same skip applies when `package-manager` resolves but
# which package manager to use is ambiguous (see "Detect package
# manager" below).
#
# Debounce (#1381, #2023, #2638): a burst of IDD-originated comments (30
# in ~15 min on PR #2628) fired `rerun-advisory-convergence.mjs --apply`
# once per comment, exhausting every same-HEAD instance's one-time rerun
# budget mid-burst. The "Check for newer qualifying event" step below
# waits a short quiet window, then re-queries whether a newer
# IDD-originated comment/review has since landed on the same PR; if so,
# this run skips its own `--apply` call and leaves it to the
# later-triggered run (which asks the same question in turn). This is a
# job-body-level check -- it does not alter `cancel-in-progress: false`
# below, which stays exactly as #2136 established it. (Note on that
# setting's actual scope: it protects only the currently in-progress
# run in this group from cancellation; a merely *pending*, not-yet-
# started run is still cancelled and replaced by the newest pending run
# when another is queued behind it, since no `queue:` key is set here
# -- the debounce below exists for the case where a run has already
# started and must itself decide whether a newer event supersedes it,
# which that pending-run replacement does not cover.) If the debounce
# step's own live-data collection fails, the step fails and GitHub
# Actions' default sequential-failure behavior skips "Rerun required
# HEAD check" entirely for that run -- safe, since this is a
# non-required companion refresh, and a later qualifying event (or the
# required check's own polling) will trigger a fresh attempt.
name: IDD advisory-convergence comment refresh
concurrency:
  # Do not cancel: a later human LGTM must not abort an in-flight
  # IDD-originated refresh before it reruns the required check (#2136).
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
on:
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write
defaults:
  run:
    shell: bash
jobs:
  refresh-if-idd-originated:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    timeout-minutes: 10
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve helper-runtime profile
        id: profile
        run: |
          # Fail-closed default, mirroring idd-doctor.mjs's
          # resolveConfiguredHelperRuntime: an absent, unreadable, or
          # invalid config -- or one that simply omits helperRuntime --
          # resolves to instructions-only (no runnable command), never a
          # guess at a runnable profile. Validates the WHOLE
          # helperRuntime object -- object type, only "profile"/
          # "packageSpec" keys, profile enum membership, packageSpec
          # shell-safe-character allowlist -- against the same rules as
          # policy-helpers.mts's inspectHelperRuntimeConfig, instead of
          # only the "profile" field, so a malformed sibling field
          # cannot silently activate a profile the canonical validator
          # would reject.
          PROFILE="instructions-only"
          PACKAGE_SPEC=""
          if ! command -v jq >/dev/null 2>&1; then
            # Distinguish "jq is missing" from a genuine instructions-only
            # config: without jq, no config file can be parsed at all, so
            # this would otherwise silently masquerade as an intentional
            # instructions-only choice. GitHub-hosted runner images ship
            # jq by default; this only bites a jq-less self-hosted runner.
            echo "::warning::jq is not available on this runner, so helperRuntime.profile cannot be resolved; treating as instructions-only. Install jq on this runner, or use a runner image that provides it."
          else
            for CANDIDATE in .github/idd/config.json idd-policy.json; do
              if [ -f "$CANDIDATE" ]; then
                if RESOLVED=$(jq -r '
                  (.helperRuntime) as $hr
                  | ($hr != null and ($hr|type) == "object") as $is_object
                  | if $is_object then
                      (($hr | keys) - ["profile","packageSpec"]) as $extra
                      | ($hr.profile) as $profile
                      | ($extra | length == 0) as $keys_ok
                      | ($profile != null and ($profile|type) == "string" and ($profile|length) > 0 and (["vendored-node","package-manager","ephemeral-npx","instructions-only"] | index($profile)) != null) as $profile_ok
                      | (if ($hr | has("packageSpec")) then
                           ($hr.packageSpec) as $spec
                           | ($spec != null and ($spec|type) == "string" and ($spec | test("\\A[A-Za-z0-9@:/_.+^#%-]+\\z")))
                         else true end) as $spec_ok
                      | if ($keys_ok and $profile_ok and $spec_ok) then
                          "\($hr.profile)\t\($hr.packageSpec // "")"
                        else empty end
                    else empty end
                ' "$CANDIDATE" 2>/dev/null) && [ -n "$RESOLVED" ]; then
                  IFS=$'\t' read -r PROFILE PACKAGE_SPEC <<<"$RESOLVED"
                fi
                # First present candidate file wins outright, valid or not
                # -- never fall through to the legacy idd-policy.json name
                # once the canonical file has been evaluated.
                break
              fi
            done
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "package-spec=$PACKAGE_SPEC" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.profile.outputs.profile != 'instructions-only'
        with:
          node-version: 24.x
      - name: Detect package manager
        id: manager
        if: steps.profile.outputs.profile == 'package-manager'
        run: |
          # Same precedence as helper-runtime-manifest.mts's own
          # collectHelperRuntimeEvidence for the "declared field" and
          # "exactly one lockfile" cases: an explicit package.json
          # "packageManager" field wins, then lockfile presence when
          # exactly one supported lockfile exists. When more than one
          # supported lockfile coexists with no declared field, this
          # mirrors collectHelperRuntimeEvidence's own "do not guess an
          # install path" stance (ambiguousPackageManager) instead of
          # silently picking by a fixed pnpm/npm/yarn priority order,
          # which could select a manager whose lockfile lacks the IDD
          # helper dependency and fail with a confusing error. When
          # there is no evidence at all (no declared field, no
          # lockfile), this is a workflow-specific fallback to npm, NOT
          # a mirror of collectHelperRuntimeEvidence (which leaves the
          # manager unset in that case, cascading to instructions-only
          # via recommendHelperRuntimeProfile) -- npm ships with every
          # setup-node Node.js install, so defaulting to it here is
          # safe even though the canonical onboarding recommender is
          # more conservative about "no evidence" (idd-skill#2392).
          MANAGER=$(node -e "
            const fs = require('node:fs');
            let declared = '';
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              declared = String(pkg.packageManager || '').split('@')[0];
            } catch {
              // No readable package.json: fall through to lockfile detection.
            }
            if (['npm', 'pnpm', 'yarn'].includes(declared)) {
              console.log(declared);
            } else {
              const lockfiles = [
                ['pnpm-lock.yaml', 'pnpm'],
                ['package-lock.json', 'npm'],
                ['yarn.lock', 'yarn'],
              ].filter(([file]) => fs.existsSync(file));
              if (lockfiles.length === 1) {
                console.log(lockfiles[0][1]);
              } else if (lockfiles.length === 0) {
                console.log('npm');
              } else {
                console.log('ambiguous');
              }
            }
          ")
          if [ "$MANAGER" = "ambiguous" ]; then
            echo "::warning::Multiple package-manager lockfiles were found with no declared \"packageManager\" field in package.json; refusing to guess which one to use. Add a \"packageManager\": \"<name>@<version>\" field to package.json, or remove the stale lockfile(s)."
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
      - name: Install dependencies (package-manager profile)
        if: steps.profile.outputs.profile == 'package-manager' && steps.manager.outputs.manager != 'ambiguous'
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$MANAGER" in
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
            *)
              npm ci
              ;;
          esac
      - name: Classify review comment
        id: origin
        if: steps.profile.outputs.profile != 'instructions-only' && steps.manager.outputs.manager != 'ambiguous'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          PACKAGE_SPEC: ${{ steps.profile.outputs.package-spec }}
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$PROFILE" in
            vendored-node)
              node scripts/review-comment-origin.mjs
              ;;
            package-manager)
              case "$MANAGER" in
                pnpm)
                  pnpm exec idd-review-comment-origin
                  ;;
                yarn)
                  yarn idd-review-comment-origin
                  ;;
                *)
                  npm exec idd-review-comment-origin --
                  ;;
              esac
              ;;
            ephemeral-npx)
              SPEC="${PACKAGE_SPEC:-https://codeload.github.com/kurone-kito/idd-skill/tar.gz/refs/heads/main}"
              npx --yes --package "$SPEC" idd-review-comment-origin
              ;;
          esac
      - name: Check for newer qualifying event
        id: debounce
        if: steps.origin.outputs.idd_originated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # Same dual-trigger-family PR-number resolution as the rerun
          # step below.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Both pull_request_review_comment and issue_comment carry the
          # triggering comment's own timestamp at github.event.comment
          # (matching COMMENT_BODY above).
          TRIGGERED_AT: ${{ github.event.comment.created_at }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          PACKAGE_SPEC: ${{ steps.profile.outputs.package-spec }}
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$PROFILE" in
            vendored-node)
              node scripts/advisory-comment-debounce.mjs --pr "$PR_NUMBER" --triggered-at "$TRIGGERED_AT"
              ;;
            package-manager)
              case "$MANAGER" in
                pnpm)
                  pnpm exec idd-advisory-comment-debounce --pr "$PR_NUMBER" --triggered-at "$TRIGGERED_AT"
                  ;;
                yarn)
                  yarn idd-advisory-comment-debounce --pr "$PR_NUMBER" --triggered-at "$TRIGGERED_AT"
                  ;;
                *)
                  npm exec idd-advisory-comment-debounce -- --pr "$PR_NUMBER" --triggered-at "$TRIGGERED_AT"
                  ;;
              esac
              ;;
            ephemeral-npx)
              SPEC="${PACKAGE_SPEC:-https://codeload.github.com/kurone-kito/idd-skill/tar.gz/refs/heads/main}"
              npx --yes --package "$SPEC" idd-advisory-comment-debounce --pr "$PR_NUMBER" --triggered-at "$TRIGGERED_AT"
              ;;
          esac
      - name: Rerun required HEAD check
        if: steps.origin.outputs.idd_originated == 'true' && steps.debounce.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # pull_request_review_comment carries the PR number at
          # github.event.pull_request.number; issue_comment (#2411)
          # carries it at github.event.issue.number instead.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          PACKAGE_SPEC: ${{ steps.profile.outputs.package-spec }}
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi
          case "$PROFILE" in
            vendored-node)
              node scripts/rerun-advisory-convergence.mjs --pr "$PR_NUMBER" --apply
              ;;
            package-manager)
              case "$MANAGER" in
                pnpm)
                  pnpm exec idd-rerun-advisory-convergence --pr "$PR_NUMBER" --apply
                  ;;
                yarn)
                  yarn idd-rerun-advisory-convergence --pr "$PR_NUMBER" --apply
                  ;;
                *)
                  npm exec idd-rerun-advisory-convergence -- --pr "$PR_NUMBER" --apply
                  ;;
              esac
              ;;
            ephemeral-npx)
              SPEC="${PACKAGE_SPEC:-https://codeload.github.com/kurone-kito/idd-skill/tar.gz/refs/heads/main}"
              npx --yes --package "$SPEC" idd-rerun-advisory-convergence --pr "$PR_NUMBER" --apply
              ;;
            *)
              echo "::error::unrecognized helper-runtime profile \"$PROFILE\""
              exit 1
              ;;
          esac
