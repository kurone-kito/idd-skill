name: IDD self-waiver token-scope probe

# issue_comment uses the workflow definition from the repository's default branch.
on:
  issue_comment:
    types: [created]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  probe-self-waiver-token-scopes:
    if: ${{ github.event.issue.pull_request != null && github.event.comment.body == '/idd-probe-token-scopes' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Probe self-waiver read access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT_BODY" != '/idd-probe-token-scopes' ]]; then
            echo "Ignoring a comment that does not exactly match the probe command."
            exit 0
          fi
          NORMALIZED_GH_HOST=$(printf '%s' "${GH_HOST:-}" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          if [ -z "$NORMALIZED_GH_HOST" ]; then
            SERVER_HOST=$(printf '%s' "$GITHUB_SERVER_URL" \
              | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##; s#/+$##' \
              | tr '[:upper:]' '[:lower:]')
            if [ -z "$SERVER_HOST" ]; then
              echo "::error::Could not determine GitHub host from GITHUB_SERVER_URL."
              exit 1
            fi
            NORMALIZED_GH_HOST="$SERVER_HOST"
          fi
          export GH_HOST="$NORMALIZED_GH_HOST"
          READ_SCOPE_EVIDENCE=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,url,headRefName,headRefOid,baseRefName,statusCheckRollup \
            --jq '[any(.statusCheckRollup[]?; .__typename == "CheckRun" and ((.workflowName // "") | length > 0)), any(.statusCheckRollup[]?; .__typename == "StatusContext")] | map(tostring) | join(" ")')
          read -r HAS_ACTION_CHECKS HAS_LEGACY_STATUS_CONTEXT <<< "$READ_SCOPE_EVIDENCE"
          if [ "$HAS_ACTION_CHECKS" != "true" ]; then
            echo "::error::PR #$PR_NUMBER has no Actions check run; choose a PR with at least one check run."
            exit 1
          fi
          if [ "$HAS_LEGACY_STATUS_CONTEXT" != "true" ]; then
            echo "::error::PR #$PR_NUMBER has no legacy status context; choose a PR with an Actions check run and a legacy status context."
            exit 1
          fi
          REPOSITORY_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -z "$REPOSITORY_OWNER" ] || [ "$REPOSITORY_NAME" = "$GITHUB_REPOSITORY" ] || [ -z "$REPOSITORY_NAME" ]; then
            echo "::error::Could not determine repository identity for the linked-issue GraphQL read."
            exit 1
          fi
          if ! CLOSING_ISSUE_RESPONSE=$(gh api graphql \
            -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner,name:$repo) { pullRequest(number:$number) { closingIssuesReferences(first:1) { nodes { number } pageInfo { hasNextPage } } } } }' \
            -F owner="$REPOSITORY_OWNER" \
            -F repo="$REPOSITORY_NAME" \
            -F number="$PR_NUMBER"); then
            echo "::error::Could not read linked closing issues for PR #$PR_NUMBER."
            exit 1
          fi
          if ! HAS_CLOSING_ISSUE=$(printf '%s' "$CLOSING_ISSUE_RESPONSE" | jq -r '
            if ((.errors // []) | length) > 0 then
              error("GraphQL query returned errors")
            elif (.data.repository.pullRequest.closingIssuesReferences | type) != "object" then
              error("missing closing issue connection")
            elif (.data.repository.pullRequest.closingIssuesReferences.nodes | type) != "array" then
              error("missing closing issue nodes")
            elif (.data.repository.pullRequest.closingIssuesReferences.pageInfo.hasNextPage | type) != "boolean" then
              error("missing closing issue page info")
            elif any(.data.repository.pullRequest.closingIssuesReferences.nodes[]; (.number | type) != "number" or .number <= 0) then
              error("malformed closing issue number")
            else
              any(.data.repository.pullRequest.closingIssuesReferences.nodes[]; .number > 0) | tostring
            end'); then
            echo "::error::The linked-issue GraphQL response for PR #$PR_NUMBER was incomplete or malformed."
            exit 1
          fi
          if [ "$HAS_CLOSING_ISSUE" != "true" ]; then
            echo "::error::PR #$PR_NUMBER has no linked closing issue; choose a PR with a linked issue to exercise closingIssuesReferences."
            exit 1
          fi
          echo "Read-only self-waiver query probe succeeded for PR #$PR_NUMBER with Actions, legacy status, and a linked issue."
