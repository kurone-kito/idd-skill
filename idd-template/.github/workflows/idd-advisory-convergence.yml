name: IDD advisory-convergence gate
# Optional, opt-in required-check workflow (see ONBOARDING.md "Optional
# — host idd-advisory-convergence as a required-check CI workflow" for
# the full rationale, the required-check Ruleset registration step, and
# the waiver-after-deadline escape path). Copy this file into your
# repository's .github/workflows/ to enable it -- it is not wired in
# automatically by importing the rest of idd-template/, since a new
# required-status-check-able workflow is a deliberate adopter decision,
# not a default.
#
# Runner: shipped default is `ubuntu-slim`. Override without editing
# the file via the `runner` workflow_call / workflow_dispatch input
# (same shape as this source repository's pnpm-boundary.yml) or the
# `CI_RUNNER_LABEL` repository variable (Settings > Secrets and
# variables > Actions > Variables). The variable is the pull_request
# path's no-edit escape hatch. GHES does not support GitHub-hosted
# runners, so set `CI_RUNNER_LABEL` (or pass `runner`) to a
# bash-capable self-hosted label there; the same override covers any
# organization that mandates self-hosted runners on github.com/GHEC.
# `defaults.run.shell` pins every `run:` step to `bash` regardless of
# runner OS, since GitHub Actions' per-OS default (PowerShell Core on
# Windows) would otherwise silently misinterpret this file's POSIX
# shell syntax.
#
# Adjust the pinned `actions/checkout` SHA (or use the floating `@v4`
# tag as shipped here), the checkout `ref:` (see below), and the
# `node scripts/...` command to your own helper-runtime profile. This
# file intentionally uses the portable `ubuntu-slim` fallback +
# `@v4` forms rather than a repository-specific pinned SHA or a
# hardcoded custom runner label, unlike this source repository's own
# dogfooded copy at .github/workflows/idd-advisory-convergence.yml.
concurrency:
  cancel-in-progress: true
  # Grouped by PR number, not github.ref: pull_request_review is not a
  # pull_request-family event, so github.ref does not resolve the same
  # way for it as it does for a pull_request-only workflow.
  # Review-thread comments live in the companion
  # idd-advisory-convergence-comment.yml workflow and must not share
  # this group. workflow_dispatch has no pull_request context either,
  # so it falls back to its own input.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
      runner:
        description: Runner label (default ubuntu-slim)
        required: false
        type: string
        default: ubuntu-slim
  workflow_call:
    inputs:
      runner:
        default: ubuntu-slim
        required: false
        type: string
      pr_number:
        description: PR number when this workflow is called without a pull_request event
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core
    # on Windows, which would silently misinterpret this file's POSIX
    # shell syntax (e.g. "$PR_NUMBER" as an undefined PowerShell
    # variable) instead of failing loudly. Available on every
    # GitHub-hosted runner, including Windows via Git Bash, so this is
    # a no-op on the runners this template ships for today.
    shell: bash
jobs:
  # The job id `idd-advisory-convergence` is the exact check-run context
  # consumed by the rerun helper, advisory-wait policy, required status
  # check, and external-check waiver selector. Adding a `name:` display-name
  # key or changing the job id changes that literal context. This warning is
  # preventive; no observed incident yet. If either edit is intentional,
  # update every consumer to the new literal context together.
  idd-advisory-convergence:
    # See the header comment above for the runner / CI_RUNNER_LABEL override.
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    # Bounds pathological hangs; adjust to your own observed run duration
    # once you have history (see idd-doctor.yml/lint.yml in the source
    # repository for the pattern of sizing this from real run durations).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted default-branch checkout, not the PR head, for any
          # trigger type including workflow_dispatch: the enforcement
          # script (scripts/advisory-convergence.mjs) and its config
          # (.github/idd/config.json) must be the trusted copy, not the
          # PR's own -- otherwise a PR could edit the verdict logic
          # itself to force `ready: true`. The verdict still correctly
          # evaluates the intended PR: `--pr <number>` below drives
          # every live GitHub API call the script makes, independent of
          # what is checked out locally. Replace `main` with your own
          # default branch name if it differs.
          ref: main
          persist-credentials: false
      # Preinstalled Node on a hosted image is not guaranteed to satisfy
      # this repo's engines.node floor (package.json), regardless of
      # whether the job uses the shipped ubuntu-slim default or an
      # override. Pin an explicit version so the mirrored template stays
      # portable. This source repository's own copy can skip setup-node
      # because its runner's preinstalled Node is already known-good
      # (see idd-doctor.yml / lint.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # workflow_dispatch's `pr_number` input is `type: number` in the
          # UI, but that constraint is not strictly enforced for direct API
          # dispatches, so route it through env: and reference it as a
          # quoted shell variable rather than interpolating the `${{ }}`
          # expression directly into the run: script.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/advisory-convergence.mjs --pr "$PR_NUMBER" --assert
