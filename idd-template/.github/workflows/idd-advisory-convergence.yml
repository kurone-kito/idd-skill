name: IDD advisory-convergence gate
# Optional, opt-in required-check workflow (see ONBOARDING.md "Optional
# — host idd-advisory-convergence as a required-check CI workflow" for
# the full rationale, the required-check Ruleset registration step, and
# the waiver-after-deadline escape path). Copy this file into your
# repository's .github/workflows/ to enable it -- it is not wired in
# automatically by importing the rest of idd-template/, since a new
# required-status-check-able workflow is a deliberate adopter decision,
# not a default.
#
# Runner: shipped default is `ubuntu-slim`. Override without editing
# the file via the `runner` workflow_call / workflow_dispatch input
# (same shape as this source repository's pnpm-boundary.yml) or the
# `CI_RUNNER_LABEL` repository variable (Settings > Secrets and
# variables > Actions > Variables). The variable is the pull_request
# path's no-edit escape hatch. GHES does not support GitHub-hosted
# runners, so set `CI_RUNNER_LABEL` (or pass `runner`) to a
# bash-capable self-hosted label there; the same override covers any
# organization that mandates self-hosted runners on github.com/GHEC.
# `defaults.run.shell` pins every `run:` step to `bash` regardless of
# runner OS, since GitHub Actions' per-OS default (PowerShell Core on
# Windows) would otherwise silently misinterpret this file's POSIX
# shell syntax.
#
# Adjust the pinned `actions/checkout` SHA (or use the floating `@v4`
# tag as shipped here) and the checkout `ref:` (see below) to your own
# conventions. The invocation itself needs no hand-editing: it resolves
# and branches on `helperRuntime.profile` automatically (see "Profile
# resolution" below) -- configure that field in `.github/idd/config.json`
# instead of editing the `run:` steps. This file intentionally uses the
# portable `ubuntu-slim` fallback + `@v4` forms rather than a
# repository-specific pinned SHA or a hardcoded custom runner label,
# unlike this source repository's own dogfooded copy at
# .github/workflows/idd-advisory-convergence.yml.
#
# Profile resolution: mirrors post-merge-cleanup.yml's
# helperRuntime.profile resolution and per-step `if:` gating (see its
# header for the full profile contract). This file diverges from that
# pattern in one place: because this job is the required-check verdict
# itself (not a best-effort cleanup with an agent-side fallback), an
# `instructions-only` profile fails the job outright instead of
# skipping -- a required check whose steps all silently skip would
# report `success`, turning the merge gate into an unconditional
# rubber stamp. The same applies when `package-manager` resolves but
# which package manager to use is ambiguous (see "Detect package
# manager" below): "Fail closed on ambiguous package manager" stops the
# job outright rather than silently skipping.
concurrency:
  cancel-in-progress: true
  # Grouped by PR number, not github.ref: pull_request_target resolves
  # github.ref to the base branch (the same value for every PR targeting
  # it), so grouping by ref would collapse unrelated PRs into one slot.
  # Review-thread comments and review submissions live in the companion
  # idd-advisory-convergence-comment.yml workflow and must not share
  # this group. Isolate workflow_dispatch so a manual re-check cannot
  # cancel an in-flight PR-linked run.
  #
  # kurone-kito/idd-skill#2657 (Codex review, PR #2895): also isolate
  # pull_request from pull_request_target (previously grouped together)
  # -- both fire on the same opened/synchronize PR event, so whichever
  # instance started later could cancel the other mid-run, including the
  # pull_request_target instance's own idd-advisory-convergence-self-
  # waiver job, which would then never finish posting the bootstrap
  # marker for that push (a cancelled run is not itself a new trigger,
  # so recovery would need a manual rerun -- defeating the whole
  # no-human-click point of that job). A new push still correctly
  # cancels a STALE run of the SAME event type for the same PR.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.pr_number) || format('{0}-{1}', github.event_name, github.event.pull_request.number || inputs.pr_number) }}
on:
  # Trigger-migration transition state: pull_request is evaluated
  # against the pull request's own merge ref, so a same-repository PR
  # could edit this file's copy to force its own required check green.
  # pull_request_target closes that gap -- it is evaluated against the
  # base branch's own workflow YAML instead -- but cannot fire against
  # the PR that first adds or edits this trigger, only against PRs
  # opened afterward, so both stay active together rather than a
  # single-PR replacement that would leave the implementing PR unable
  # to satisfy its own required check. Drop pull_request once this has
  # run cleanly on production PRs for a period. pull_request_review
  # moved to the companion idd-advisory-convergence-comment.yml
  # workflow instead of staying here, for the identical reason.
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
      runner:
        description: Runner label (default ubuntu-slim)
        required: false
        type: string
        default: ubuntu-slim
  workflow_call:
    inputs:
      runner:
        default: ubuntu-slim
        required: false
        type: string
      pr_number:
        description: PR number when this workflow is called without a pull_request event
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core
    # on Windows, which would silently misinterpret this file's POSIX
    # shell syntax (e.g. "$PR_NUMBER" as an undefined PowerShell
    # variable) instead of failing loudly. Available on every
    # GitHub-hosted runner, including Windows via Git Bash, so this is
    # a no-op on the runners this template ships for today.
    shell: bash
jobs:
  # The job id `idd-advisory-convergence` is the exact check-run context
  # consumed by the rerun helper, advisory-wait policy, required status
  # check, and external-check waiver selector. Adding a `name:` display-name
  # key or changing the job id changes that literal context. This warning is
  # preventive; no observed incident yet. If either edit is intentional,
  # update every consumer to the new literal context together.
  idd-advisory-convergence:
    # See the header comment above for the runner / CI_RUNNER_LABEL override.
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    # Bounds pathological hangs; adjust to your own observed run duration
    # once you have history (see idd-doctor.yml/lint.yml in the source
    # repository for the pattern of sizing this from real run durations).
    timeout-minutes: 10
    # kurone-kito/idd-skill#2657 (Codex review, PR #2895): sequenced after
    # the self-waiver job below so an allowlisted PR's own bootstrap
    # marker is guaranteed to exist (posted or definitively not posted)
    # before this job ever fetches PR comments -- without this ordering,
    # the two jobs share no dependency and start in parallel, so this
    # (typically much faster) job can read comments and fail BEFORE the
    # self-waiver job finishes its diff check, claim resolution, and
    # posting call. Since posting a PR comment is not one of this
    # workflow's own trigger events, that race would leave the required
    # check red until an unrelated push or manual rerun -- defeating the
    # whole "no human click required" point of the bootstrap path.
    # `if: ${{ !cancelled() }}` overrides `needs:`'s own default (a
    # skipped dependency job skips its dependents too) -- this job must
    # still run on every trigger, including `workflow_dispatch` or a
    # `pull_request` run where the self-waiver job's own `if:` skips it
    # outright, and a non-allowlisted PR where it runs but posts nothing.
    needs: idd-advisory-convergence-self-waiver
    if: ${{ !cancelled() }}
    # Job-level override of the workflow-level `permissions:` block above,
    # adding `actions: read` (Codex review, PR #2895): `port.getWorkflowRun`
    # (the self-referential-bootstrap-auto trust verification) calls
    # `GET /repos/{owner}/{repo}/actions/runs/{id}`, which needs this scope
    # explicitly in a private repository (an unspecified `GITHUB_TOKEN`
    # permission defaults to `none`, not inherited from the repository's
    # own default). A job-level block replaces the workflow-level one
    # entirely rather than adding to it, so every previously-granted scope
    # is repeated here too. The self-waiver job below never calls this
    # endpoint, so its own job-level permissions (unaffected by this one)
    # do not need this scope.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted default-branch checkout, not the PR head, for any
          # trigger type including workflow_dispatch: the enforcement
          # script (scripts/advisory-convergence.mjs) and its config
          # (.github/idd/config.json) must be the trusted copy, not the
          # PR's own -- otherwise a PR could edit the verdict logic
          # itself to force `ready: true`. The verdict still correctly
          # evaluates the intended PR: `--pr <number>` below drives
          # every live GitHub API call the script makes, independent of
          # what is checked out locally. Replace `main` with your own
          # default branch name if it differs.
          ref: main
          persist-credentials: false
      - name: Resolve helper-runtime profile
        id: profile
        run: |
          # Fail-closed default, mirroring idd-doctor.mjs's
          # resolveConfiguredHelperRuntime: an absent, unreadable, or
          # invalid config -- or one that simply omits helperRuntime --
          # resolves to instructions-only (no runnable command), never a
          # guess at a runnable profile. Validates the WHOLE
          # helperRuntime object -- object type, only "profile"/
          # "packageSpec" keys, profile enum membership, packageSpec
          # shell-safe-character allowlist -- against the same rules as
          # policy-helpers.mts's inspectHelperRuntimeConfig, instead of
          # only the "profile" field, so a malformed sibling field
          # cannot silently activate a profile the canonical validator
          # would reject.
          PROFILE="instructions-only"
          PACKAGE_SPEC=""
          if ! command -v jq >/dev/null 2>&1; then
            # Distinguish "jq is missing" from a genuine instructions-only
            # config: without jq, no config file can be parsed at all, so
            # this would otherwise silently masquerade as an intentional
            # instructions-only choice. GitHub-hosted runner images ship
            # jq by default; this only bites a jq-less self-hosted runner.
            echo "::warning::jq is not available on this runner, so helperRuntime.profile cannot be resolved; treating as instructions-only. Install jq on this runner, or use a runner image that provides it."
          else
            for CANDIDATE in .github/idd/config.json idd-policy.json; do
              if [ -f "$CANDIDATE" ]; then
                if RESOLVED=$(jq -r '
                  (.helperRuntime) as $hr
                  | ($hr != null and ($hr|type) == "object") as $is_object
                  | if $is_object then
                      (($hr | keys) - ["profile","packageSpec"]) as $extra
                      | ($hr.profile) as $profile
                      | ($extra | length == 0) as $keys_ok
                      | ($profile != null and ($profile|type) == "string" and ($profile|length) > 0 and (["vendored-node","package-manager","ephemeral-npx","instructions-only"] | index($profile)) != null) as $profile_ok
                      | (if ($hr | has("packageSpec")) then
                           ($hr.packageSpec) as $spec
                           | ($spec != null and ($spec|type) == "string" and ($spec | test("\\A[A-Za-z0-9@:/_.+^#%-]+\\z")))
                         else true end) as $spec_ok
                      | if ($keys_ok and $profile_ok and $spec_ok) then
                          "\($hr.profile)\t\($hr.packageSpec // "")"
                        else empty end
                    else empty end
                ' "$CANDIDATE" 2>/dev/null) && [ -n "$RESOLVED" ]; then
                  IFS=$'\t' read -r PROFILE PACKAGE_SPEC <<<"$RESOLVED"
                fi
                # First present candidate file wins outright, valid or not
                # -- never fall through to the legacy idd-policy.json name
                # once the canonical file has been evaluated.
                break
              fi
            done
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "package-spec=$PACKAGE_SPEC" >> "$GITHUB_OUTPUT"
      - name: Fail closed when no helper runtime is configured
        if: steps.profile.outputs.profile == 'instructions-only'
        run: |
          echo "::error::This repository hosts idd-advisory-convergence as a required check but resolves helperRuntime.profile to instructions-only (no runnable helper command). Configure helperRuntime.profile in .github/idd/config.json, or stop hosting this workflow as a required check."
          exit 1
      - uses: actions/setup-node@v4
        if: steps.profile.outputs.profile != 'instructions-only'
        with:
          node-version: 24.x
      - name: Detect package manager
        id: manager
        if: steps.profile.outputs.profile == 'package-manager'
        run: |
          # Same precedence as helper-runtime-manifest.mts's own
          # collectHelperRuntimeEvidence for the "declared field" and
          # "exactly one lockfile" cases: an explicit package.json
          # "packageManager" field wins, then lockfile presence when
          # exactly one supported lockfile exists. When more than one
          # supported lockfile coexists with no declared field, this
          # mirrors collectHelperRuntimeEvidence's own "do not guess an
          # install path" stance (ambiguousPackageManager) instead of
          # silently picking by a fixed pnpm/npm/yarn priority order,
          # which could select a manager whose lockfile lacks the IDD
          # helper dependency and fail with a confusing error. When
          # there is no evidence at all (no declared field, no
          # lockfile), this is a workflow-specific fallback to npm, NOT
          # a mirror of collectHelperRuntimeEvidence (which leaves the
          # manager unset in that case, cascading to instructions-only
          # via recommendHelperRuntimeProfile) -- npm ships with every
          # setup-node Node.js install, so defaulting to it here is
          # safe even though the canonical onboarding recommender is
          # more conservative about "no evidence" (idd-skill#2392).
          MANAGER=$(node -e "
            const fs = require('node:fs');
            let declared = '';
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              declared = String(pkg.packageManager || '').split('@')[0];
            } catch {
              // No readable package.json: fall through to lockfile detection.
            }
            if (['npm', 'pnpm', 'yarn'].includes(declared)) {
              console.log(declared);
            } else {
              const lockfiles = [
                ['pnpm-lock.yaml', 'pnpm'],
                ['package-lock.json', 'npm'],
                ['yarn.lock', 'yarn'],
              ].filter(([file]) => fs.existsSync(file));
              if (lockfiles.length === 1) {
                console.log(lockfiles[0][1]);
              } else if (lockfiles.length === 0) {
                console.log('npm');
              } else {
                console.log('ambiguous');
              }
            }
          ")
          if [ "$MANAGER" = "ambiguous" ]; then
            echo "::warning::Multiple package-manager lockfiles were found with no declared \"packageManager\" field in package.json; refusing to guess which one to use. Add a \"packageManager\": \"<name>@<version>\" field to package.json, or remove the stale lockfile(s)."
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
      - name: Fail closed on ambiguous package manager
        if: steps.manager.outputs.manager == 'ambiguous'
        run: |
          echo "::error::This repository hosts idd-advisory-convergence as a required check with helperRuntime.profile resolved to package-manager, but multiple package-manager lockfiles were found with no declared \"packageManager\" field in package.json, so which manager to use cannot be determined. Add a \"packageManager\": \"<name>@<version>\" field to package.json, or remove the stale lockfile(s)."
          exit 1
      - name: Install dependencies (package-manager profile)
        if: steps.profile.outputs.profile == 'package-manager'
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$MANAGER" in
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
            *)
              npm ci
              ;;
          esac
      - name: Run advisory-convergence check
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # workflow_dispatch's `pr_number` input is `type: number` in the
          # UI, but that constraint is not strictly enforced for direct API
          # dispatches, so route it through env: and reference it as a
          # quoted shell variable rather than interpolating the `${{ }}`
          # expression directly into the run: script.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          PACKAGE_SPEC: ${{ steps.profile.outputs.package-spec }}
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi
          case "$PROFILE" in
            vendored-node)
              node scripts/advisory-convergence.mjs --pr "$PR_NUMBER" --assert
              ;;
            package-manager)
              case "$MANAGER" in
                pnpm)
                  pnpm exec idd-advisory-convergence --pr "$PR_NUMBER" --assert
                  ;;
                yarn)
                  yarn idd-advisory-convergence --pr "$PR_NUMBER" --assert
                  ;;
                *)
                  # npm requires a literal `--` before forwarded flags;
                  # pnpm/yarn above do not.
                  npm exec idd-advisory-convergence -- --pr "$PR_NUMBER" --assert
                  ;;
              esac
              ;;
            ephemeral-npx)
              SPEC="${PACKAGE_SPEC:-https://codeload.github.com/kurone-kito/idd-skill/tar.gz/refs/heads/main}"
              npx --yes --package "$SPEC" idd-advisory-convergence --pr "$PR_NUMBER" --assert
              ;;
            *)
              # Unreachable by construction (the profile-resolution step
              # only ever emits one of the four known profile values, and
              # instructions-only already failed the job above), but a
              # required check must never silently no-op and report
              # success on an unexpected profile value.
              echo "::error::unrecognized helper-runtime profile \"$PROFILE\""
              exit 1
              ;;
          esac

  # kurone-kito/idd-skill#2657: optional companion job -- a PR that fixes
  # this gate's own checking logic (or a handful of directly-related
  # files) can never benefit from its own fix while unmerged, because the
  # verdict job above always runs the version checked out from `main`.
  # This job auto-posts a narrowly-scoped, run-bound
  # `idd-external-check-waiver` marker for exactly that case. See
  # docs/idd-helper-scripts.md's "External-check waiver contract"
  # (self-referential-bootstrap-auto section) for the full trust model
  # and the four acceptance conditions `advisory-convergence.mts`
  # verifies before ever honoring the marker -- this job's only role is
  # to detect the trigger and post it; trust is established entirely at
  # consume time, not here.
  #
  # `if: pull_request_target` only, never `pull_request`: a
  # same-repository PR editing this YAML could otherwise also run this
  # job under a `pull_request`-triggered instance it fully controls. The
  # consumer's fourth trust condition (the marker's `run-id:` must
  # resolve to a `pull_request_target`-triggered run) would reject a
  # marker from that instance anyway, but gating the job itself here
  # avoids granting `issues: write` under an untrusted-YAML trigger in
  # the first place.
  #
  # This job duplicates the verdict job's own profile-resolution and
  # dependency-install steps rather than sharing them via `needs:` +
  # job outputs: this template's workflows are each single-job by
  # convention, and the duplication keeps this job independently
  # copy-and-adjustable (or removable) without touching the required
  # verdict job above.
  idd-advisory-convergence-self-waiver:
    if: github.event_name == 'pull_request_target'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    timeout-minutes: 10
    # Narrower than the verdict job's read-only posture above: this job
    # additionally needs `pull-requests: read` (to diff and fetch the PR)
    # and `issues: write` (to post the marker, and to read the linked
    # issue's own comment stream to resolve its active claim -- the
    # PR-conversation-comment endpoint and the linked-issue-comment
    # endpoint are both gated under the Issues permission category, same
    # as the verdict job's own header comment already notes for reads).
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted default-branch checkout, not the PR head -- see the
          # verdict job's own comment above for the full rationale. This
          # job's posting logic (external-check-waiver) must be the
          # trusted copy too, or a PR could edit it to post a
          # differently-shaped marker or waive an unrelated check.
          ref: main
          persist-credentials: false
      - name: Resolve helper-runtime profile
        id: profile
        run: |
          PROFILE="instructions-only"
          PACKAGE_SPEC=""
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not available on this runner, so helperRuntime.profile cannot be resolved; treating as instructions-only. Install jq on this runner, or use a runner image that provides it."
          else
            for CANDIDATE in .github/idd/config.json idd-policy.json; do
              if [ -f "$CANDIDATE" ]; then
                if RESOLVED=$(jq -r '
                  (.helperRuntime) as $hr
                  | ($hr != null and ($hr|type) == "object") as $is_object
                  | if $is_object then
                      (($hr | keys) - ["profile","packageSpec"]) as $extra
                      | ($hr.profile) as $profile
                      | ($extra | length == 0) as $keys_ok
                      | ($profile != null and ($profile|type) == "string" and ($profile|length) > 0 and (["vendored-node","package-manager","ephemeral-npx","instructions-only"] | index($profile)) != null) as $profile_ok
                      | (if ($hr | has("packageSpec")) then
                           ($hr.packageSpec) as $spec
                           | ($spec != null and ($spec|type) == "string" and ($spec | test("\\A[A-Za-z0-9@:/_.+^#%-]+\\z")))
                         else true end) as $spec_ok
                      | if ($keys_ok and $profile_ok and $spec_ok) then
                          "\($hr.profile)\t\($hr.packageSpec // "")"
                        else empty end
                    else empty end
                ' "$CANDIDATE" 2>/dev/null) && [ -n "$RESOLVED" ]; then
                  IFS=$'\t' read -r PROFILE PACKAGE_SPEC <<<"$RESOLVED"
                fi
                break
              fi
            done
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "package-spec=$PACKAGE_SPEC" >> "$GITHUB_OUTPUT"
      - name: Fail closed when no helper runtime is configured
        if: steps.profile.outputs.profile == 'instructions-only'
        run: |
          echo "::error::This repository hosts the idd-advisory-convergence-self-waiver job but resolves helperRuntime.profile to instructions-only (no runnable helper command). Configure helperRuntime.profile in .github/idd/config.json, or remove this optional job."
          exit 1
      - uses: actions/setup-node@v4
        if: steps.profile.outputs.profile != 'instructions-only'
        with:
          node-version: 24.x
      - name: Detect package manager
        id: manager
        if: steps.profile.outputs.profile == 'package-manager'
        run: |
          MANAGER=$(node -e "
            const fs = require('node:fs');
            let declared = '';
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              declared = String(pkg.packageManager || '').split('@')[0];
            } catch {
              // No readable package.json: fall through to lockfile detection.
            }
            if (['npm', 'pnpm', 'yarn'].includes(declared)) {
              console.log(declared);
            } else {
              const lockfiles = [
                ['pnpm-lock.yaml', 'pnpm'],
                ['package-lock.json', 'npm'],
                ['yarn.lock', 'yarn'],
              ].filter(([file]) => fs.existsSync(file));
              if (lockfiles.length === 1) {
                console.log(lockfiles[0][1]);
              } else if (lockfiles.length === 0) {
                console.log('npm');
              } else {
                console.log('ambiguous');
              }
            }
          ")
          if [ "$MANAGER" = "ambiguous" ]; then
            echo "::warning::Multiple package-manager lockfiles were found with no declared \"packageManager\" field in package.json; refusing to guess which one to use. Add a \"packageManager\": \"<name>@<version>\" field to package.json, or remove the stale lockfile(s)."
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
      - name: Fail closed on ambiguous package manager
        if: steps.manager.outputs.manager == 'ambiguous'
        run: |
          echo "::error::This job resolves helperRuntime.profile to package-manager, but multiple package-manager lockfiles were found with no declared \"packageManager\" field in package.json, so which manager to use cannot be determined. Add a \"packageManager\": \"<name>@<version>\" field to package.json, or remove the stale lockfile(s)."
          exit 1
      - name: Install dependencies (package-manager profile)
        if: steps.profile.outputs.profile == 'package-manager'
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$MANAGER" in
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
            *)
              npm ci
              ;;
          esac
      - name: Detect self-referential trigger-file allowlist touch
        id: allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          # kurone-kito/idd-skill#2657 (Codex + Copilot review, PR #2895):
          # the checker's own file surface differs by
          # helperRuntime.profile -- a vendored-node adopter runs the
          # COMPILED scripts/*.mjs (this profile never vends the source
          # repository's own src/scripts/*.mts; see
          # idd-helper-scripts.md's vendored-node row), and a
          # package-manager adopter has no local checker file at all,
          # upgrading it only through its dependency manifest and
          # lockfile. Using this source repository's own src/scripts/*.mts
          # paths unconditionally left the mechanism both non-functional
          # for its intended adopters (a genuine checker upgrade could
          # never match) and gameable (a PR could touch a path that does
          # not exist at all in the adopter's own checkout purely to
          # satisfy the string match). The two workflow paths are
          # profile-invariant: every profile's own checker version pin
          # lives in one of them or in the profile-specific paths below.
          ALLOWLIST=(
            ".github/workflows/idd-advisory-convergence.yml"
            ".github/workflows/idd-advisory-convergence-comment.yml"
          )
          case "$PROFILE" in
            vendored-node)
              ALLOWLIST+=(
                "scripts/advisory-convergence.mjs"
                "scripts/advisory-wait-state.mjs"
                "scripts/advisory-wait-policy.mjs"
                "scripts/rerun-advisory-convergence.mjs"
                "scripts/external-check-waiver.mjs"
              )
              ;;
            package-manager)
              ALLOWLIST+=(
                "package.json"
                "package-lock.json"
                "pnpm-lock.yaml"
                "yarn.lock"
              )
              ;;
          esac
          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only)
          TOUCHED=false
          for FILE in "${ALLOWLIST[@]}"; do
            if grep -qxF "$FILE" <<<"$CHANGED"; then
              TOUCHED=true
              break
            fi
          done
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
      - name: Post the self-referential-bootstrap-auto waiver
        # Skip a fork PR entirely: the consumer's run-bound trust check
        # would reject it anyway (a fork's own workflow run never matches
        # this repository), so this avoids a doomed post and the API
        # calls it would cost.
        if: steps.allowlist.outputs.touched == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          PACKAGE_SPEC: ${{ steps.profile.outputs.package-spec }}
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          case "$PROFILE" in
            vendored-node)
              node scripts/external-check-waiver.mjs --pr "$PR_NUMBER" --check idd-advisory-convergence --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" --auto-bootstrap --apply --yes
              ;;
            package-manager)
              case "$MANAGER" in
                pnpm)
                  pnpm exec idd-external-check-waiver --pr "$PR_NUMBER" --check idd-advisory-convergence --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" --auto-bootstrap --apply --yes
                  ;;
                yarn)
                  yarn idd-external-check-waiver --pr "$PR_NUMBER" --check idd-advisory-convergence --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" --auto-bootstrap --apply --yes
                  ;;
                *)
                  npm exec idd-external-check-waiver -- --pr "$PR_NUMBER" --check idd-advisory-convergence --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" --auto-bootstrap --apply --yes
                  ;;
              esac
              ;;
            ephemeral-npx)
              SPEC="${PACKAGE_SPEC:-https://codeload.github.com/kurone-kito/idd-skill/tar.gz/refs/heads/main}"
              npx --yes --package "$SPEC" idd-external-check-waiver --pr "$PR_NUMBER" --check idd-advisory-convergence --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" --auto-bootstrap --apply --yes
              ;;
            *)
              echo "::error::unrecognized helper-runtime profile \"$PROFILE\""
              exit 1
              ;;
          esac
