concurrency:
  cancel-in-progress: false
  group: merged-pr-feedback-sweep
name: Merged-PR feedback sweep (weekly summary)
# Manual only (issue #4161). The sweep is read-only. This workflow is its one
# writer, and it writes only the single open summary issue titled below: a run
# renders the sweep of the last seven days, then creates that issue, or edits
# it in place when it already exists. It refuses to write when the open-issue
# listing is full or when more than one open issue carries the title. There is
# deliberately no schedule and no push or pull_request trigger; the schedule is
# a follow-up after the first successful dispatch run.
#
# The checkout uses the dispatched ref. A dispatch of a pushed branch runs that
# branch's code and writes the live summary issue, so it validates the job
# before its pull request opens (D2). A dispatch on the default branch
# exercises the merged code.
on:
  workflow_dispatch:
# contents read and issues write only. The sweep reads pull requests under this
# token, and the first dispatch run confirms that the reads succeed on this
# public repository.
permissions:
  contents: read
  issues: write
jobs:
  sweep:
    env:
      GH_TOKEN: ${{ github.token }}
      SWEEP_ISSUE_TITLE: Merged-PR feedback sweep (weekly)
    # ubuntu-latest, not ubuntu-slim: ubuntu-slim caps a job at 15 minutes,
    # below the bound set here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Render the summary issue body
        run: |
          set -euo pipefail
          # --limit 500 covers the expected weekly volume. A scan that still
          # reaches the cap says so in the body.
          node scripts/merged-pr-feedback-sweep.mjs \
            --days 7 \
            --limit 500 \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --issue-body > "$RUNNER_TEMP/sweep-body.md"
          test -s "$RUNNER_TEMP/sweep-body.md"
      - name: Create or update the summary issue
        run: |
          set -euo pipefail
          # The open issues are read as one listing, not searched, so an issue
          # created moments earlier is seen at once. A full listing could hide
          # the summary issue, so the step stops instead of creating a copy.
          listing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title)"
          length="$(printf '%s' "$listing" | jq 'length')"
          case "$length" in
            ''|*[!0-9]*)
              echo "::error::the open-issue listing did not yield a count; refusing to write"
              exit 1
              ;;
          esac
          if [ "$length" -ge 1000 ]; then
            echo "::error::the open-issue listing reached its 1000-row limit, so the summary issue may be outside it; refusing to create a duplicate"
            exit 1
          fi
          found="$(printf '%s' "$listing" | jq -r --arg t "$SWEEP_ISSUE_TITLE" '[.[] | select(.title == $t) | .number] | sort | .[]')"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::more than one open issue is titled \"$SWEEP_ISSUE_TITLE\" ($(printf '%s' "$found" | tr '\n' ' ')); close the extras, then rerun"
            exit 1
          elif [ "$count" -eq 1 ]; then
            gh issue edit "$found" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/sweep-body.md"
          elif [ "$count" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$SWEEP_ISSUE_TITLE" --body-file "$RUNNER_TEMP/sweep-body.md"
          else
            echo "::error::could not count the matching issues; refusing to write"
            exit 1
          fi
