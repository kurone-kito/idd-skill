concurrency:
  cancel-in-progress: false
  group: merged-pr-feedback-sweep
name: Merged-PR feedback sweep (weekly summary)
# Weekly and manual (issues #4161 and #4166). The sweep is read-only. This
# workflow is its one writer, and it writes only the single open summary issue
# titled below. The render job runs the sweep and holds only read scopes. The
# write job holds the one issues write scope, checks out nothing, and runs no
# repository code, so no branch code can use the write token. The write job
# refuses to write when the open-issue listing is full, when the listing does
# not yield a count, or when more than one open issue carries the title. The
# only triggers are the weekly schedule and manual dispatch; there is
# deliberately no push or pull_request trigger.
#
# The render job checks out the dispatched ref, so a dispatch of a pushed branch
# renders that branch's code and validates the render before its pull request
# opens (D2). The write job runs only on the default branch, so a branch
# dispatch never writes the shared summary issue, and only merged code can
# publish to it.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
# Least privilege at the workflow level; each job declares its own scopes below.
permissions: {}
jobs:
  render:
    env:
      GH_TOKEN: ${{ github.token }}
      # Set beside GH_TOKEN in the other gh-calling workflows of this repository,
      # so gh resolves the token on a GitHub Enterprise host as well.
      GH_ENTERPRISE_TOKEN: ${{ github.token }}
    # Read-only. pull-requests read lets the sweep list and read pull requests.
    # Without it the listing comes back empty and the summary says so falsely;
    # the first dispatch run (38396980939) showed exactly that.
    permissions:
      contents: read
      pull-requests: read
    # ubuntu-latest, not ubuntu-slim: ubuntu-slim caps a job at 15 minutes,
    # below the bound set here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      body_b64: ${{ steps.render.outputs.body_b64 }}
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Render the summary issue body
        id: render
        run: |
          set -euo pipefail
          # --limit 500 covers the expected weekly volume. A scan that still
          # reaches the cap says so in the body.
          node scripts/merged-pr-feedback-sweep.mjs \
            --days 7 \
            --limit 500 \
            --owner "${GITHUB_REPOSITORY%%/*}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --issue-body > "$RUNNER_TEMP/sweep-body.md"
          test -s "$RUNNER_TEMP/sweep-body.md"
          # Base64 keeps the multi-line body safe as one step output.
          echo "body_b64=$(base64 -w0 "$RUNNER_TEMP/sweep-body.md")" >> "$GITHUB_OUTPUT"
  write:
    needs: render
    # Publishes only from the default branch. A branch dispatch still renders, so
    # its output can be inspected, but it cannot write the shared summary issue.
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_ENTERPRISE_TOKEN: ${{ github.token }}
      SWEEP_ISSUE_TITLE: Merged-PR feedback sweep (weekly)
      BODY_B64: ${{ needs.render.outputs.body_b64 }}
    # Write-only. The job checks out nothing, so it runs no repository code.
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or update the summary issue
        run: |
          set -euo pipefail
          printf '%s' "$BODY_B64" | base64 -d > "$RUNNER_TEMP/sweep-body.md"
          test -s "$RUNNER_TEMP/sweep-body.md"
          # The open issues are read as one listing, not searched, so an issue
          # created moments earlier is seen at once. A full listing could hide
          # the summary issue, so the step stops instead of creating a copy.
          listing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title)"
          length="$(printf '%s' "$listing" | jq 'length')"
          case "$length" in
            ''|*[!0-9]*)
              echo "::error::the open-issue listing did not yield a count; refusing to write"
              exit 1
              ;;
          esac
          if [ "$length" -ge 1000 ]; then
            echo "::error::the open-issue listing reached its 1000-row limit, so the summary issue may be outside it; refusing to create a duplicate"
            exit 1
          fi
          found="$(printf '%s' "$listing" | jq -r --arg t "$SWEEP_ISSUE_TITLE" '[.[] | select(.title == $t) | .number] | sort | .[]')"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::more than one open issue is titled \"$SWEEP_ISSUE_TITLE\" ($(printf '%s' "$found" | tr '\n' ' ')); close the extras, then rerun"
            exit 1
          # The body scores the report 1 (human-only), and the repository contract
          # pairs that score with the blocked-by-human label (issue #4283).
          elif [ "$count" -eq 1 ]; then
            gh issue edit "$found" --repo "$GITHUB_REPOSITORY" --add-label status:blocked-by-human --body-file "$RUNNER_TEMP/sweep-body.md"
          elif [ "$count" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$SWEEP_ISSUE_TITLE" --label status:blocked-by-human --body-file "$RUNNER_TEMP/sweep-body.md"
          else
            echo "::error::could not count the matching issues; refusing to write"
            exit 1
          fi
