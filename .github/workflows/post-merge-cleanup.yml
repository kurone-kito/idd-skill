# Trust model: this workflow triggers on `pull_request_target`, which runs
# with base-repository permissions and secrets even for pull requests from
# forks. That is safe here only because all of the following hold, and any
# future edit to this file must preserve them:
#   - No unreviewed PR-head content is ever checked out: the sole
#     `actions/checkout` step below carries no `ref:` override, so it
#     resolves to the `pull_request_target` default -- the base branch's
#     tip at event time. Because the job only proceeds when
#     `merged == true`, that tip already includes this PR's own merge
#     (this repository merges via merge commits, so it is typically that
#     merge commit itself) -- it is never the PR's own head SHA, and
#     never content that has not already passed through the merge
#     decision.
#   - No PR-head code, workflow, or action is ever executed: the only
#     script that runs is this repository's own tracked
#     `scripts/audit-pr-cleanup.mjs`, invoked with the PR number as inert
#     numeric data. The `pr_number` value (a `workflow_dispatch` number
#     input, not strictly enforced as numeric for direct API dispatches)
#     is passed through `env:` and referenced as a quoted shell variable,
#     never interpolated directly into a `run:` script.
#   - The `cleanup` job only runs when
#     `github.event.pull_request.merged == true`, or via an explicit,
#     human-triggered `workflow_dispatch` -- never against an open or
#     unmerged pull request.
#   - `permissions:` stays least-privilege: `contents: read`,
#     `issues: write`, `pull-requests: write` -- no `contents: write` and
#     no elevated or secret-bearing scopes.
# If a future change adds a `ref:` override on the checkout step, downloads
# or executes PR-head content, widens `permissions:`, or removes the
# merged-only guard, re-review this trust model before merging that change.
name: Post-merge cleanup
on:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to clean up
        required: true
        type: number
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: post-merge-cleanup-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          node-version: 24.x
      - name: Run F4 cleanup (server-side fallback)
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # workflow_dispatch's `pr_number` input is `type: number` in the
          # UI, but that constraint is not strictly enforced for direct API
          # dispatches, so route it through env: and reference it as a
          # quoted shell variable rather than interpolating the `${{ }}`
          # expression directly into the run: script.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set +e
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi
          JSON=$(node scripts/audit-pr-cleanup.mjs \
            --pr "$PR_NUMBER" \
            --apply \
            --skip-claim-check \
            --format json 2>cleanup-stderr.log)
          HELPER_EXIT=$?
          set -e
          # Prefer the helper's JSON report when it is parseable, even on
          # non-zero exit (the helper writes the report then exits 1 when
          # failed.length > 0, so the report is still authoritative).
          PARSED_STATUS=""
          if [ -n "$JSON" ]; then
            PARSED_STATUS=$(printf '%s' "$JSON" | jq -r '.status // ""' 2>/dev/null || echo "")
          fi
          if [ -n "$PARSED_STATUS" ]; then
            printf '%s\n' "$JSON" > cleanup-report.json
            STATUS="$PARSED_STATUS"
            APPLIED=$(printf '%s' "$JSON" | jq -r '(.applied // []) | length')
            FAILED=$(printf '%s' "$JSON" | jq -r '(.failed // []) | length')
            SKIPPED=$(printf '%s' "$JSON" | jq -r '(.skipped // []) | length')
            BLOCKED=$(printf '%s' "$JSON" | jq -r '[(.skipped // [])[] | select(.isMinimized==false and .viewerCanMinimize==false)] | length')
            RETRY_ATTEMPTS=$(printf '%s' "$JSON" | jq -r '.retryAttempts // 0')
            RETRY_BOUND_EXHAUSTED=$(printf '%s' "$JSON" | jq -r '.retryBoundExhausted // false')
            if [ "$HELPER_EXIT" -ne 0 ]; then
              echo "::warning::audit-pr-cleanup exited $HELPER_EXIT but emitted a valid JSON report; using helper status \"$STATUS\""
            fi
          else
            echo "::warning::audit-pr-cleanup exited $HELPER_EXIT with no parseable JSON; posting helper-error evidence"
            STATUS="helper-error"
            APPLIED=0
            FAILED=0
            SKIPPED=0
            BLOCKED=0
            RETRY_ATTEMPTS=0
            RETRY_BOUND_EXHAUSTED=false
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "status=$STATUS"
            echo "applied=$APPLIED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "blocked=$BLOCKED"
            echo "retry_attempts=$RETRY_ATTEMPTS"
            echo "retry_bound_exhausted=$RETRY_BOUND_EXHAUSTED"
          } >> "$GITHUB_OUTPUT"
      - name: Post cleanup evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cleanup.outputs.pr_number }}
          STATUS: ${{ steps.cleanup.outputs.status }}
          APPLIED: ${{ steps.cleanup.outputs.applied }}
          FAILED: ${{ steps.cleanup.outputs.failed }}
          SKIPPED: ${{ steps.cleanup.outputs.skipped }}
          BLOCKED: ${{ steps.cleanup.outputs.blocked }}
          RETRY_ATTEMPTS: ${{ steps.cleanup.outputs.retry_attempts }}
          RETRY_BOUND_EXHAUSTED: ${{ steps.cleanup.outputs.retry_bound_exhausted }}
        run: |
          # Avoid duplicate evidence comments, but only on a genuinely
          # converged outcome. Workflow-level concurrency only serialises
          # this workflow's own runs; an agent F4 (or a maintainer
          # rerunning workflow_dispatch on the same PR) can still have
          # posted an evidence comment outside this run. Skip only when
          # BOTH the latest trusted <!-- idd-cleanup-evidence: {status}
          # ... --> comment already records `applied`/`clean` AND this
          # run's own outcome is also `applied`/`clean` (#2213) -- a
          # prior success alone must never suppress this run's own
          # non-success evidence (masking a later failure), and a prior
          # non-success alone must never suppress this run's own success
          # evidence (masking a later recovery). Only a truly redundant
          # "still converged" repeat is skipped; any status transition in
          # either direction always posts fresh evidence.
          # "Trusted" scoping: this workflow's own posts are authored by
          # `github-actions[bot]` (the GITHUB_TOKEN actor), and an agent's
          # local F4 post is authored by a configured `trustedMarkerActors`
          # login. An untrusted commenter pre-posting this marker prefix
          # must never suppress the genuine evidence post or be treated as
          # a completed cleanup record (this is the same trust-scoping
          # every other IDD operational marker already applies).
          TRUSTED_LOGINS=$(
            {
              jq -r '(.trustedMarkerActors // [])[]' .github/idd/config.json 2>/dev/null
              echo 'github-actions[bot]'
            } | tr '[:upper:]' '[:lower:]'
          )
          # Capture into a variable (not process substitution): a failure
          # inside `< <(gh api ...)` does not reliably propagate to this
          # shell's default `-e`/`pipefail`, which could leave EXISTING
          # empty and post a duplicate evidence comment on a transient
          # `gh api` failure (rate limit/network). A plain command
          # substitution assignment does trip `-e` on failure.
          #
          # The API returns issue comments in creation-ascending order, so
          # iterating every match without an early `break` and keeping the
          # last assignment leaves EXISTING/EXISTING_STATUS holding the
          # *latest* trusted comment, not merely the first one found.
          COMMENTS_TSV=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- idd-cleanup-evidence:")) | [.id, .user.login, (.body | split("\n")[0])] | @tsv')
          EXISTING=""
          EXISTING_STATUS=""
          while IFS=$'\t' read -r candidate_id candidate_login candidate_marker_line; do
            [ -z "$candidate_id" ] && continue
            lower_login=$(printf '%s' "$candidate_login" | tr '[:upper:]' '[:lower:]')
            if printf '%s\n' "$TRUSTED_LOGINS" | grep -Fxq "$lower_login"; then
              EXISTING="$candidate_id"
              EXISTING_STATUS=$(printf '%s' "$candidate_marker_line" \
                | sed -n 's/^<!-- idd-cleanup-evidence: \([^ ]*\) .*/\1/p')
            fi
          done <<< "$COMMENTS_TSV"
          if [ -n "$EXISTING" ] \
            && { [ "$EXISTING_STATUS" = "applied" ] || [ "$EXISTING_STATUS" = "clean" ]; } \
            && { [ "$STATUS" = "applied" ] || [ "$STATUS" = "clean" ]; }; then
            echo "::notice::PR #${PR_NUMBER} already has a trusted-author idd-cleanup-evidence comment recording '${EXISTING_STATUS}', and this run's own outcome '${STATUS}' is also converged (id: ${EXISTING}); skipping workflow post."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "<!-- idd-cleanup-evidence: ${STATUS} applied:${APPLIED} failed:${FAILED} skipped:${SKIPPED} viewer-cannot-minimize:${BLOCKED} retry-attempts:${RETRY_ATTEMPTS} retry-bound-exhausted:${RETRY_BOUND_EXHAUSTED} -->" \
            "**F4 Cleanup Evidence** (server-side fallback via \`post-merge-cleanup.yml\`)" \
            "| Field              | Value |" \
            "| ------------------ | ----- |" \
            "| Status             | ${STATUS} |" \
            "| Applied            | ${APPLIED} |" \
            "| Failed             | ${FAILED} |" \
            "| Skipped            | ${SKIPPED} |" \
            "| Permission-blocked | ${BLOCKED} |" \
            "| Retry attempts (bound-exhausted) | ${RETRY_ATTEMPTS} (${RETRY_BOUND_EXHAUSTED}) |" \
            "| Posted by          | post-merge-cleanup workflow |" \
          )
          printf '%s' "$BODY" | gh pr comment "$PR_NUMBER" --body-file -
