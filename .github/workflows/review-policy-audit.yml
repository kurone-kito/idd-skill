name: Review policy audit
# Weekly audit of pull requests merged in a fixed UTC window. Scheduled runs
# cover the previous Monday through Sunday; workflow_dispatch can supply both
# merged-from and merged-to dates or fall back to the previous seven complete
# UTC days. The helper writes the report to the job log and cohort counts to
# GITHUB_STEP_SUMMARY. The check exits 1 on an unparsed Copilot overview, a
# malformed Triage line, an accepted defer contradiction, a recorded-share
# shortfall since 2026-10-25, or any PR that could not be audited.
#
# A PR costs about four REST requests, plus one GraphQL edit-state query per
# 100 review comments. The 217-PR week of 2026-10-12 through 2026-10-18
# therefore needed about 900 REST requests. GITHUB_TOKEN allows 1,000 REST
# requests per hour per repository, shared with pull-request CI and other
# workflows; the merged-pr-feedback-sweep runs at 06:00 UTC, 41 minutes before
# this audit. If failedPrs is nonempty, dispatch the same date window after the
# rate limit resets. The ubuntu-slim runner also has a hard 15-minute cap; if
# that stops a run, dispatch the same window once more.
#
# Source-repository only: this workflow is never distributed to idd-template/.
on:
  schedule:
    # Mondays 06:41 UTC. The minute is offset from the top of the hour and the
    # half hour, where GitHub documents scheduled runs being delayed under
    # load. The slot avoids stale.yml (Monday 00:00 UTC), codeql.yml (Monday
    # 03:30 UTC), merged-pr-feedback-sweep.yml (Monday 06:00 UTC), and
    # scheduled-typecheck.yml (daily 05:17 UTC).
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      merged-from:
        description: First UTC merge date, inclusive (both dates are required together)
        required: false
        type: string
      merged-to:
        description: Last UTC merge date, inclusive (both dates are required together)
        required: false
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      # Read-only audit: no need to persist the token in git config. The
      # default fetch depth is kept because the audit reads no git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert Node.js floor
        run: |
          node --version
          node -e '
            const fs = require("fs");
            let enginesNode = "<unavailable>";
            let accepted = false;
            try {
              const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const declaredEnginesNode = manifest && manifest.engines && manifest.engines.node;
              if (typeof declaredEnginesNode !== "string") throw new Error("missing engines.node");
              enginesNode = declaredEnginesNode;
              const clauses = enginesNode.trim().split(/\s*\|\|\s*/);
              if (clauses.length < 2) throw new Error("invalid engines.node shape");
              const versions = clauses.map((clause, index) => {
                const pattern = index === clauses.length - 1
                  ? /^>=(\d+)\.(\d+)\.(\d+)$/
                  : /^\^(\d+)\.(\d+)\.(\d+)$/;
                const match = pattern.exec(clause);
                if (!match) throw new Error("invalid engines.node clause");
                const version = match.slice(1).map(Number);
                if (!version.every(Number.isSafeInteger)) throw new Error("invalid version number");
                return version;
              });
              const runtimeMatch = /^(\d+)\.(\d+)\.(\d+)$/.exec(process.versions.node);
              if (!runtimeMatch) throw new Error("invalid runtime version");
              const runtime = runtimeMatch.slice(1).map(Number);
              const compare = (left, right) => {
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] !== right[index]) return left[index] - right[index];
                }
                return 0;
              };
              accepted = versions.slice(0, -1).some((version) =>
                runtime[0] === version[0] && compare(runtime, version) >= 0
              ) || compare(runtime, versions[versions.length - 1]) >= 0;
            } catch (error) {
              accepted = false;
            }
            if (process.versions.node.includes("-")) accepted = false;
            if (!accepted) {
              console.error("Node " + process.version + " does not satisfy package.json engines.node range: " + String(enginesNode));
              process.exit(1);
            }
          '
      - name: Audit recent pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_FROM_INPUT: ${{ inputs['merged-from'] }}
          MERGED_TO_INPUT: ${{ inputs['merged-to'] }}
          BASELINE_REVIEWS_PER_PR: '3.908296943231441'
        shell: bash
        run: |
          if [[ -n "$MERGED_FROM_INPUT" && -n "$MERGED_TO_INPUT" ]]; then
            merged_from="$MERGED_FROM_INPUT"
            merged_to="$MERGED_TO_INPUT"
          else
            merged_from="$(date -u -d '7 days ago' +%F)"
            merged_to="$(date -u -d '1 day ago' +%F)"
          fi
          printf 'Auditing merged pull requests from %s through %s (UTC)\n' "$merged_from" "$merged_to"
          node scripts/copilot-review-wave-audit.mjs \
            --merged-from "$merged_from" \
            --merged-to "$merged_to" \
            --check \
            --since 2026-10-25 \
            --baseline-reviews-per-pr "$BASELINE_REVIEWS_PER_PR" \
            --step-summary "$GITHUB_STEP_SUMMARY"
      - name: Report Copilot reviewer runs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_FROM_INPUT: ${{ inputs['merged-from'] }}
          MERGED_TO_INPUT: ${{ inputs['merged-to'] }}
        shell: bash
        run: |
          if [[ -n "$MERGED_FROM_INPUT" && -n "$MERGED_TO_INPUT" ]]; then
            merged_from="$MERGED_FROM_INPUT"
            merged_to="$MERGED_TO_INPUT"
          else
            merged_from="$(date -u -d '7 days ago' +%F)"
            merged_to="$(date -u -d '1 day ago' +%F)"
          fi
          printf 'Auditing Copilot reviewer runs created from %s through %s (UTC)\n' "$merged_from" "$merged_to"
          node scripts/copilot-review-wave-audit.mjs \
            --reviewer-runs-from "$merged_from" \
            --reviewer-runs-to "$merged_to" \
            --step-summary "$GITHUB_STEP_SUMMARY"
