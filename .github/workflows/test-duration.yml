name: Test duration
# #5261: a manual measurement of the `test` group of
# src/scripts/check-project.mts on Node 22, 24, and 26. It exists so that a
# pull request does not gain a Node 26 test shard, or a split of any shard,
# before the three durations are known (roadmap #5179). It is dispatched by
# hand, is not a required check, and has no pull_request trigger. It does not
# change the pnpm-boundary.yml matrix.
#
# Each Node column prints two job durations and, from the Node test runner's
# own file-level `test:complete` event, the duration of every
# tests/*.test.mts file in seconds. Setup and install mirror
# pnpm-boundary.yml, so the columns are comparable with the pull_request lane.
# The job duration that GitHub reports (the API `started_at` to
# `completed_at` of the job) is the figure to quote. The in-job figure below
# starts at the first step, so it leaves out runner setup and cleanup.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-duration:
    name: test-duration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Longer than pnpm-boundary.yml's 30 minutes on purpose: a measurement run
    # that is cancelled at its cap reports nothing, and uncensored runs of the
    # suite reached 22.5 minutes (issue #5013). It still bounds a hang.
    timeout-minutes: 45
    strategy:
      # One slow or failing Node column must not cancel the other two.
      fail-fast: false
      matrix:
        # Node 22 selects .node-version, the floor of engines.node, as the
        # pull_request lane of pnpm-boundary.yml does. The other entries use
        # the newest release of their major. The key that an entry omits is
        # empty, and setup-node then reads the other input.
        include:
          - node: '22'
            node-version-file: .node-version
          - node: '24'
            node-version: 24.x
          - node: '26'
            node-version: 26.x
    steps:
      - name: Record the job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          check-latest: true
          cache: pnpm
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run the test group
        id: tests
        # Below the job cap, so the report step still runs when the suite hangs.
        timeout-minutes: 35
        env:
          # The reporter module below is the only addition to the normal
          # command. The spec reporter keeps the usual per-test log on stdout,
          # and the module appends one row per test file to a file next to it.
          # It yields no output of its own. Node rejects reporters whose count
          # differs from the destinations' count, so each reporter names stdout.
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ runner.temp }}/file-duration-reporter.mjs --test-reporter-destination=stdout
        run: |
          cat > "$RUNNER_TEMP/file-duration-reporter.mjs" <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          // The file-level test of a process-isolated run is named after its
          // file, so nesting 0 plus a name that resolves to the file path
          // selects exactly one event per tests/*.test.mts file. Each row is
          // appended as it arrives, so a killed run keeps the rows it had. The
          // output path comes from this module's own location, not from the
          // environment, so a test that spawns a nested `node --test` with a
          // scrubbed environment still reaches a writable file.
          export default async function* (source) {
            for await (const event of source) {
              const data = event.data;
              if (
                event.type === 'test:complete' &&
                data.nesting === 0 &&
                data.file &&
                resolve(data.name) === data.file
              ) {
                appendFileSync(
                  new URL('file-durations.tsv', import.meta.url),
                  `${(data.details.duration_ms / 1000).toFixed(3)}\t${data.name}\n`,
                );
              }
            }
          }
          EOF
          SECONDS=0
          status=0
          pnpm run check test || status=$?
          echo "test group duration: ${SECONDS} s"
          echo "TEST_GROUP_SECONDS=${SECONDS}" >> "$GITHUB_ENV"
          exit "$status"
      - name: Report the durations
        if: ${{ always() }}
        env:
          NODE_LABEL: ${{ matrix.node }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          now=$(date +%s)
          job_seconds=$(( now - ${JOB_START:-$now} ))
          tab=$(printf '\t')
          expected="$RUNNER_TEMP/expected-files.txt"
          raw="$RUNNER_TEMP/file-durations.tsv"
          table="$RUNNER_TEMP/file-durations-sorted.tsv"
          ls tests/*.test.mts | LC_ALL=C sort > "$expected"
          : > "$table"
          if [ -f "$raw" ]; then
            # One row per expected test file, ignoring any other row.
            awk -F '\t' 'NR == FNR { want[$0]; next } ($2 in want) && !($2 in seen) { seen[$2]; print }' "$expected" "$raw" \
              | LC_ALL=C sort -t "$tab" -k2,2 > "$table"
          fi
          expected_count=$(wc -l < "$expected")
          recorded_count=$(wc -l < "$table")
          missing=$(cut -f2 "$table" | LC_ALL=C comm -13 - "$expected")
          node_version=$(node --version)
          echo "Node $NODE_LABEL: ${node_version}"
          echo "test step outcome: ${TEST_OUTCOME}"
          echo "job duration, in-job first step to this step (seconds): ${job_seconds}"
          echo "test group duration (seconds): ${TEST_GROUP_SECONDS:-unknown}"
          echo "test files recorded: ${recorded_count} of ${expected_count}"
          if [ -n "$missing" ]; then
            echo "::warning::no duration was recorded for these test files:"
            echo "$missing"
          fi
          echo "file duration in seconds, then path (sorted by path):"
          sed 's/^/file-duration /' "$table"
          {
            echo "### Node $NODE_LABEL (${node_version})"
            echo ""
            echo "- test step outcome: ${TEST_OUTCOME}"
            echo "- job duration, in-job first step to last step: ${job_seconds} s"
            echo "- test group duration: ${TEST_GROUP_SECONDS:-unknown} s"
            echo "- test files recorded: ${recorded_count} of ${expected_count}"
            echo ""
            echo "| seconds | file |"
            echo "| ---: | --- |"
            awk -F '\t' '{ printf "| %s | %s |\n", $1, $2 }' "$table"
          } >> "$GITHUB_STEP_SUMMARY"
