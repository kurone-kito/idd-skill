concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
name: Linting workflow
# CI topology (#832): pull_request is the only CI trigger so each check
# runs exactly once per change; the pre-PR push window is covered by the
# local pre-push contract instead of a duplicate push trigger.
#
# This workflow dogfoods the toolless bare-node adopter path: it runs
# with NO package-manager install, so every script and test it executes
# must import only `node:` builtins. The same six commands also run
# via `pnpm run lint:minimum` in pnpm-boundary.yml — that overlap is
# intentional redundancy proving both the installed and the bare-node
# runtimes. The formatting and spelling tools (dprint, cspell,
# markdownlint) run exactly once, in pnpm-boundary.yml.
on:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    # Historical ubuntu-slim runs (#3728): 94 successes had a median of
    # 521s, p90 of 671s, and maximum of 858s. Three further runs
    # (36730573670, 36752800229, 36955823310) were cancelled at 920-944s
    # with the maximum-execution annotation; they also set this 15-minute
    # job timeout, so they do not alone identify which timer fired. GitHub
    # documents ubuntu-slim's hard 15-minute cap, also seen in #3665 when a
    # 20-minute job was cancelled at 15m. The first ubuntu-latest PR run
    # (#3730, run 37040216385) used Ubuntu 24.04.5 and Node v22.23.3; the
    # Node floor assertion passed without setup-node. Its lint job took
    # 171s, including 159s for protocol tests. The slowest pnpm-boundary
    # job on ubuntu-latest took 271s. The lint job is below the 300s
    # threshold, and its 10-minute timeout is more than twice that lint
    # duration. See issue #3728 for source run details.
    timeout-minutes: 10
    steps:
      # Check the runner Node before checkout or repository scripts execute.
      # The test suite is typed `.mts` executed via Node's native type
      # stripping (unflagged since 22.18), and this lane also invokes
      # migrated helper CLIs directly (e.g. verify-workshop-integrity.mjs
      # below), whose `if (import.meta.main)` entry guard is silently
      # falsy -- not an error -- on Node 24.0.x/24.1.x (#1447). A stale
      # runner image would therefore either mis-parse the .mts files or
      # let a CLI step silently no-op, so fail loudly first. Exact match
      # to package.json's engines.node (^22.23.2 || ^24.2.0 || >=26.0.0), including
      # the patch/minor digits, so the error message's claimed range is
      # actually what the check enforces.
      - name: Assert Node.js floor
        run: |
          node --version
          node -e '
            const versionParts = process.versions.node.split(".");
            const [major, minor, patch] = versionParts.map(Number);
            const isPrerelease = versionParts.some((part) => part.includes("-"));
            const ok =
              !isPrerelease &&
              ((major === 22 && (minor > 23 || (minor === 23 && patch >= 2))) ||
                (major === 24 && minor >= 2) ||
                major >= 26);
            if (!ok) {
              console.error(
                "Node " + process.version + " does not satisfy this " +
                "repository'"'"'s engines.node range (^22.23.2 || ^24.2.0 || >=26.0.0).",
              );
              process.exit(1);
            }
          '
      # fetch-depth: 0 is required by audit-docs' changed-file diff bases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run documentation audit
        run: node scripts/audit-docs.mjs --check
      - name: Run bare-Node source contract audit
        run: node scripts/lint-source-contracts.mjs
      # Whole-tree source boundary rules (import boundaries, no direct gh
      # spawns, provider-port migration, no NUL bytes) run here as a plain
      # Node entry with no install, so extracting them out of the test suite
      # (#3748) cannot drop the bare-node lane's coverage of them.
      - name: Run source boundary lint
        run: node scripts/lint-source-boundaries.mjs
      # Schema, fixture-pair and live-instance validation (the policy config,
      # the phase graph data and the hearing catalog) runs here as a plain Node
      # entry with no install, so moving it out of the test suite (#3751)
      # cannot drop the bare-node lane's coverage of it. The schema and
      # onboarding catalog agreements run inside the audit-docs step above.
      - name: Run schema validation
        run: node scripts/validate-schemas.mjs
      - name: Run protocol tests
        run: node --test --import ./tests/isolate-state.mts tests/*.test.mts
      - name: Run workshop integrity check
        run: node scripts/verify-workshop-integrity.mjs --format table
  lint-windows:
    name: Windows platform tests
    runs-on: windows-latest
    # Regression coverage for kurone-kito/idd-skill#2892: only
    # idd-critique-telemetry-hook.mts combines `shell: true` with
    # `detached: true`, which orphaned a grandchild process (and its own
    # console window) on native Windows because `process.kill(-pid, ...)`
    # is meaningless there. Pre-fix, this suite's own hang/timeout
    # fixtures hung indefinitely on native Windows instead of completing,
    # so this bound is deliberately generous rather than tuned to an
    # observed duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unlike the `lint` job's `ubuntu-latest` runner, this repository has
      # no established preinstalled-Node contract for `windows-latest` --
      # pin explicitly rather than relying on whatever ships in the image.
      # `24.x` (not a narrower range) matches every other workflow's own
      # `node-version` in this repository (scheduled-typecheck.yml,
      # pnpm-boundary.yml, post-merge-cleanup.yml) -- `check-latest: true`
      # below resolves it to the newest available 24.x patch rather than a
      # potentially stale cached one.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          node-version: 24.x
      # Same defense as the `lint` job's own "Assert Node.js floor" step
      # above (kurone-kito/idd-skill#2892, Copilot review on PR #2897):
      # `check-latest: true` makes the 24.0.x/24.1.x window from #1447
      # unlikely in practice, but not impossible (e.g. a transient
      # registry lag), and this job runs the exact same `.mts` test-suite
      # entry point that step guards. `shell: bash` is required here --
      # unlike the `lint` job's `ubuntu-latest` runner, `windows-latest`'s
      # default `run:` shell is PowerShell, which cannot parse this
      # bash/POSIX-quoted script; GitHub's Windows runner images ship
      # Git for Windows' bash for exactly this cross-shell-reuse case.
      - name: Assert Node.js floor
        shell: bash
        run: |
          node -e '
            const versionParts = process.versions.node.split(".");
            const [major, minor, patch] = versionParts.map(Number);
            const isPrerelease = versionParts.some((part) => part.includes("-"));
            const ok =
              !isPrerelease &&
              ((major === 22 && (minor > 23 || (minor === 23 && patch >= 2))) ||
                (major === 24 && minor >= 2) ||
                major >= 26);
            if (!ok) {
              console.error(
                "Node " + process.version + " does not satisfy this " +
                "repository'"'"'s engines.node range (^22.23.2 || ^24.2.0 || >=26.0.0).",
              );
              process.exit(1);
            }
          '
      # `--test-force-exit` (kurone-kito/idd-skill#2892, #2897 CI
      # follow-up) used to be required here: this suite's direct-await
      # tests spawn real detached win32 children, and a confirmed defect
      # in that path (stuck stdin writes to a detached `cmd.exe`) left
      # libuv handles the Node process never naturally drained, hanging
      # `node --test` indefinitely on this runner even though every test
      # itself had already completed and reported. kurone-kito/idd-skill
      # #2910 fixed that underlying stdin-delivery defect (a win32-only
      # relay hop replaces the direct `cmd.exe` spawn for the primary
      # hook command), and this suite's own acceptance criterion for that
      # fix -- dropping the flag if the file-level hang no longer occurs
      # -- was confirmed live on native Windows 11: the full suite
      # (including every direct-await, real-detached-child test) now
      # completes and exits naturally in ~28s with no flag, every test
      # passing except the one POSIX-only fixture this suite always
      # skips on win32 -- no hangs, no failures. Deliberately not
      # pinning an exact pass count here: this suite's own test count
      # keeps growing as later rounds add coverage, and a hard-coded
      # number would drift stale again on the very next addition.
      - name: Run critique telemetry hook tests
        run: node --test --import ./tests/isolate-state.mts tests/idd-critique-telemetry-hook.test.mts
      # `acquireClaimLock`'s fresh-create path (#2920) deliberately
      # depends on `linkSync` returning `EEXIST` for an existing
      # destination -- true on POSIX, but Windows uses a different
      # syscall (`CreateHardLinkW`) under the hood, and #2920's own
      # acceptance criterion #2 requires that behavior verified on this
      # platform explicitly, not assumed by POSIX analogy (Copilot
      # review, PR #2923: this job previously never ran any part of
      # `tests/claim-lock.test.mts`, leaving that criterion unexercised
      # in CI). Run a narrow subset rather than the whole file: this
      # suite also has POSIX-only fixtures (e.g. permission-bit tests
      # via `chmodSync`, meaningless on Windows' ACL model) that were
      # never vetted for this runner, and this job was deliberately
      # narrowed after the #2892/#2910 hangs above -- widening it
      # wholesale reintroduces that risk for coverage this fix does not
      # need. The three selected tests are exactly the ones that
      # exercise `createLockFileExclusively`'s `linkSync` path: a plain
      # fresh acquire (create succeeds), the worker-thread race test
      # (concurrent create -- exactly one exclusive winner, every loser
      # observes `EEXIST` and reacquires), and the pre-existing-lock
      # reacquire (confirms the *no-create* fast path stays untouched).
      - name: Run claim-lock Windows-relevant tests
        # The pattern is deliberately ASCII-only (no em dash), unlike the
        # test titles themselves: this `run:` step has no `shell: bash`
        # override, so it executes as PowerShell on this runner, and a
        # non-ASCII argument's encoding through PowerShell-to-node argv
        # on Windows is untested here -- safer to match on a unique
        # substring that avoids the question entirely.
        run: >-
          node --test --import ./tests/isolate-state.mts --test-name-pattern
          "fresh acquire succeeds with no prior lock|structural invariants
          hold under a same-claim-id race|genuinely pre-existing matching
          lock reacquires with no racedCreate"
          tests/claim-lock.test.mts
      # The host-local read cache refuses a configured directory whose ACL
      # cannot be shown user-only (kurone-kito/idd-skill#3623). Only the
      # tests whose titles start with `windows acl` run: the fake-reader
      # cases and the two real-directory cases that prove the real
      # `whoami`/`icacls` reader here (an Everyone grant is refused,
      # an inheritance-stripped user-only directory is accepted). Name
      # filtered like the claim-lock step above -- never the whole file --
      # and the pattern is ASCII-only for the same PowerShell reason.
      - name: Run read-cache Windows ACL tests
        run: >-
          node --test --import ./tests/isolate-state.mts --test-name-pattern "windows acl"
          tests/github-api-read-cache.test.mts
      # Regression coverage for kurone-kito/idd-skill#2988: the full file
      # is now safe after #2989 bounded its production fetch calls and
      # #2990 made the fixture suite hermetic on Windows. Keep this
      # whole-file step distinct from the narrowed claim-lock coverage.
      - name: Run branch-conflict-state tests
        run: node --test --import ./tests/isolate-state.mts tests/branch-conflict-state.test.mts
