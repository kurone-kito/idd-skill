name: Pnpm boundary guard
# CI topology (#832): pull_request is the only CI trigger for this
# repository so each check runs exactly once per change; workflow_call
# remains for downstream callers. This workflow runs the full project
# check suite, `pnpm run check` (the `pnpm run lint:minimum` alias runs
# the same suite), with installed dependencies; the bare-node subset
# intentionally also runs in lint.yml.
#
# Rerun scope (#4993, #5263): this repository's pull_request run covers the
# check groups on Node 22, 24.x, and 26.x, except that static lint runs on
# Node 22 only. The test group runs as the three parts test-1 to test-3, each
# on all three versions, so no part sums to more than 15 minutes of the
# per-file durations that #5261 measured. "Re-run failed jobs" repeats only
# the failed version/shard lane and the small pnpm-boundary aggregate. The
# manual Node 22 floor caller selects only the Node 22 column. Every other
# caller, and any caller that passes its own lint-command, gets one full run
# in pnpm-boundary-full instead. The two job-level if: expressions are exact
# negations; if the repository check ever stops matching, the full suite
# runs once and the aggregate still gates it. In both modes the required
# check is the pnpm-boundary job.
on:
  pull_request:
  workflow_call:
    inputs:
      runner:
        default: ubuntu-slim
        required: false
        type: string
      node-version:
        default: 24.x
        required: false
        type: string
      node-version-file:
        default: ''
        required: false
        type: string
      install-command:
        default: pnpm install --frozen-lockfile --prefer-offline
        required: false
        type: string
      lint-command:
        default: pnpm run check
        required: false
        type: string
      boundary-command:
        default: node scripts/check-pnpm-boundary.mjs
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # For this repository's own pull_request runs the ref is always a PR
  # merge ref, so this evaluates to true (same effect as lint.yml's
  # unconditional setting). The conditional stays for workflow_call
  # callers: github.ref then reflects the caller's ref, which may be a
  # long-lived branch where auto-cancelling in-flight runs is unwanted.
  # The jobs below declare no concurrency of their own, so the shards of
  # one run never cancel one another.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  pnpm-boundary-group:
    name: pnpm-boundary-group (Node ${{ matrix.node-version }}, ${{ matrix.shard }})
    # The github context belongs to the caller, so this holds for this
    # repository's own pull_request lane and its Node 22 floor caller.
    if: ${{ github.repository == 'kurone-kito/idd-skill' && (inputs.lint-command || 'pnpm run check') == 'pnpm run check' }}
    # Differs from the input default: own lanes must avoid slim's 15m cap.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Issue #5013: uncensored runs reached 22.5 minutes, so keep the
    # 30-minute floor for each shard and pnpm-boundary-full.
    timeout-minutes: 30
    strategy:
      # One failed shard must not cancel the others, or a rerun would have
      # to repeat them too.
      fail-fast: false
      matrix:
        # The direct pull_request workflow runs the supported LTS matrix.
        # Other same-repository callers keep their node-version or
        # node-version-file input; the floor caller selects .node-version.
        node-version: ${{ fromJSON(github.repository == 'kurone-kito/idd-skill' && contains(github.workflow_ref, 'kurone-kito/idd-skill/.github/workflows/pnpm-boundary.yml@') && inputs.node-version-file == '' && '["22.x","24.x","26.x"]' || github.repository == 'kurone-kito/idd-skill' && inputs.node-version-file == '.node-version' && '["22.x"]' || github.repository == 'kurone-kito/idd-skill' && inputs.node-version-file != '' && '["file"]' || format('[{0}]', toJSON(inputs.node-version || '24.x'))) }}
        # The lint shard is not on this axis. Its include entry below names
        # node-version: 22.x and a shard value that no axis combination has,
        # so GitHub adds exactly one lint job, pinned to Node 22 in every
        # lane this matrix can take (issue #5263). The other shards run on
        # every version in node-version.
        shard:
          - typecheck
          - test-1
          - test-2
          - test-3
          - distribution
        # check-groups partitions check-project: each group runs in exactly
        # one shard for each Node version it is built for. pnpm passes a
        # literal `--` to the script, so group ids follow the script name.
        # The test group is split into the three parts test-1 to test-3. Each
        # part runs its own test-files, one path per line, with the command of
        # `pnpm run test:scripts`; the audit and
        # tests/repository-workflow-audit.test.mts check the command. Every
        # tests/*.test.mts file belongs to exactly one part, and since
        # decision #5182 these parts are the only full-suite run. That
        # repository test, not the audit, fails and names a file that no part
        # lists. Add a new file to any part, at its sorted position so the
        # lists stay in path order. Issue #5263 sized the parts from the
        # per-file durations of #5261 (run 43977792866): each part sums to
        # 856.8 seconds on Node 22, against 900, so about 43 seconds of
        # headroom remain there. Repack by dispatching test-duration.yml and
        # assigning the files again so that no part sums above 900 seconds on
        # any version.
        include:
          - node-version: 22.x
            shard: lint
            check-groups: lint
          - shard: typecheck
            check-groups: typecheck
          - shard: test-1
            check-groups: test
            test-files: |-
              tests/advisory-convergence.test.mts
              tests/advisory-wait-marker-grammar.test.mts
              tests/advisory-wait-recovery.test.mts
              tests/audit-authored-issue.test.mts
              tests/audit-dead-exports.test.mts
              tests/audit-docs-file-sets.test.mts
              tests/audit-docs-generated-blocks.test.mts
              tests/audit-docs-lite-gate-parity.test.mts
              tests/audit-docs-near-ceiling-ratchet.test.mts
              tests/audit-pr-cleanup.test.mts
              tests/authoring-owner-marker.test.mts
              tests/authoring-set-members.test.mts
              tests/bot-comment-corpus.test.mts
              tests/branch-name.test.mts
              tests/build-ts.test.mts
              tests/check-stray-commit-closes.test.mts
              tests/ci-wait-state.test.mts
              tests/claim-issue.test.mts
