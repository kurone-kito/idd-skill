name: Pnpm boundary guard
# CI topology (#832): pull_request is the only CI trigger for this
# repository so each check runs exactly once per change; workflow_call
# remains for downstream callers. This workflow runs the full
# `pnpm run lint:minimum` suite once with installed dependencies; the
# bare-node subset intentionally also runs in lint.yml.
on:
  pull_request:
  workflow_call:
    inputs:
      runner:
        default: ubuntu-slim
        required: false
        type: string
      node-version:
        default: 24.x
        required: false
        type: string
      install-command:
        default: pnpm install --frozen-lockfile --prefer-offline
        required: false
        type: string
      lint-command:
        default: pnpm run lint:minimum
        required: false
        type: string
      boundary-command:
        default: node scripts/check-pnpm-boundary.mjs
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # For this repository's own pull_request runs the ref is always a PR
  # merge ref, so this evaluates to true (same effect as lint.yml's
  # unconditional setting). The conditional stays for workflow_call
  # callers: github.ref then reflects the caller's ref, which may be a
  # long-lived branch where auto-cancelling in-flight runs is unwanted.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  pnpm-boundary:
    # Imported from kurone-kito/pnpm-project-template push workflow shape
    # and adapted as a reusable workflow with repository-specific guards.
    # Differs from the input default: own lanes must avoid slim's 15m cap.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # GitHub's 15-minute job cap applies to a single-CPU runner such as
    # ubuntu-slim, so a larger value never took effect there. Observed
    # 2026-09-30, run 36740857345: jobs 109974568013, 109983868974 and
    # 109990619661 were each cancelled at 15m0s although this value was
    # already 20 (the #3473 raise from 10, after run 36163057010 job
    # 108164078287 was cancelled at the old 10-minute cap on 2026-09-25).
    # On ubuntu-latest this value is effective. Twenty minutes bounds a
    # hang. It is not a performance target and it is not permission to
    # let the suite grow without a new measurement.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          cache: pnpm
          node-version: ${{ inputs.node-version || '24.x' }}
      - name: Install dependencies
        env:
          HUSKY: 0
        run: ${{ inputs.install-command || 'pnpm install --frozen-lockfile --prefer-offline' }}
      - name: Run lint minimum
        run: ${{ inputs.lint-command || 'pnpm run lint:minimum' }}
      - name: Check distributable pnpm boundary
        run: ${{ inputs.boundary-command || 'node scripts/check-pnpm-boundary.mjs' }}
