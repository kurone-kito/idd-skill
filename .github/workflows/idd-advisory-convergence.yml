concurrency:
  cancel-in-progress: true
  # Grouped by PR number, not github.ref: pull_request_target resolves
  # github.ref to the base branch (refs/heads/main), the same value for
  # every PR targeting it, so grouping by ref would collapse unrelated
  # PRs into one concurrency slot. workflow_dispatch has no pull_request
  # context either, so it falls back to its own inputs. Review-thread
  # comments and review submissions live in a separate non-required
  # workflow (#2136, #2764 Phase 1) and must not share this group.
  #
  # kurone-kito/idd-skill#2657 (Codex review, PR #2895): also grouped by
  # `github.event_name`, so the `pull_request` and `pull_request_target`
  # instances that both fire on the same opened/synchronize PR event no
  # longer share a cancellation slot. Before this, whichever instance
  # started later could cancel the other mid-run -- including the
  # `pull_request_target` instance's own `idd-advisory-convergence-self-
  # waiver` job, which would then never finish posting the bootstrap
  # marker for that push, since a cancelled run is not itself a new
  # trigger (recovery would need a manual rerun, defeating the whole
  # no-human-click point of that job). Splitting the groups by event name
  # still lets a new push correctly cancel a STALE run of the SAME event
  # type for the same PR; it costs nothing beyond the "two required-check
  # runs per PR" transition-window cost the CI-topology comment below
  # already accepts, since a run that no longer gets cancelled by its
  # sibling now more often simply completes on its own instead.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
name: IDD advisory-convergence gate
# Required-check gate (#1341): asserts that the primary advisory bot's
# ("Copilot's") review has converged on the current PR HEAD, using the
# read-only advisory-convergence helper (#1340, scripts/advisory-convergence.mjs)
# with --assert. This turns the F2 advisory/disposition sub-gate from a
# judgment the execution model must choose to honor into a
# non-bypassable required status check -- see roadmap #1342.
#
# Trigger-migration transition state (#2764 Phase 1): this workflow's
# own copy of `on:` below is evaluated against the pull request's merge
# ref for `pull_request` -- exactly the trust gap `pull_request_target`
# closes, since THAT trigger is evaluated against the base branch's own
# workflow YAML instead, so a same-repository PR cannot edit its copy of
# this file to force its own required check green. Both `pull_request`
# and `pull_request_target` are active simultaneously during Phase 1
# (same activity types on both) so the implementing PR itself stays
# normally mergeable -- `pull_request_target` cannot fire against the
# PR that first defines it, only against PRs opened after it merges to
# `main`. A follow-up issue (Phase 2, filed once Phase 1 has run cleanly
# on production PRs for a period) will remove the now-redundant
# `pull_request` trigger. The accepted, bounded cost of this transition
# window is two required-check runs per PR under the same check name,
# temporarily widening `#1381`'s known same-SHA-multiple-runs race (see
# the concurrency-hardening investigation below) from rare to routine.
#
# Read-only: contents: read + issues: read + pull-requests: read +
# actions: read (kurone-kito/idd-skill#2657, Codex review PR #2895). The
# helper only queries the GitHub API (via `gh`) for reviews, review
# threads, PR conversation comments, and waiver markers; it never
# mutates GitHub state. `issues: read` is required (not just
# pull-requests: read) because the helper reads the PR's own
# conversation comments via the issue-comments REST endpoint, which
# GitHub gates under the Issues permission category even when the
# issue number is a pull request -- see post-merge-cleanup.yml, which
# needs the same permission for the identical endpoint shape.
# `actions: read` is required for the self-referential-bootstrap-auto
# waiver's own trust verification, which reads
# `GET /repos/{owner}/{repo}/actions/runs/{run-id}` -- an unspecified
# `GITHUB_TOKEN` permission defaults to `none` in a private repository,
# not the repository's own default, so this must be granted explicitly
# even though the endpoint only reads run metadata.
#
# Trusted-code checkout (CodeRabbit review finding on PR #1345, and
# consistent with the issue's own "no execution of PR-authored code"
# framing): the checkout below is pinned to the repository's DEFAULT
# branch, never the PR head. If the PR's own (possibly edited) copy of
# scripts/advisory-convergence.mjs or .github/idd/config.json ran
# instead, a PR could trivially edit the verdict logic itself to force
# `ready: true` and defeat the whole required-check gate -- exactly the
# execution-model-controlled fail-open failure mode roadmap #1342 exists
# to close. The verdict still correctly evaluates the intended PR: `--pr
# <number>` below drives every live GitHub API call the script makes
# (reviews, threads, comments) independent of what is checked out
# locally, so pinning the checkout to the trusted branch costs nothing
# functionally while closing the tamper path. This also makes
# workflow_dispatch inherently deterministic without any extra ref
# resolution: the checkout is the same default-branch content
# regardless of which ref a maintainer happens to pick in the dispatch
# UI.
#
# This is a deliberately stricter posture than idd-doctor.yml/lint.yml,
# which do check out the PR's own content (mitigated there only by
# CODEOWNERS review): those checks are repository-health/lint gates
# where a bypass is low-stakes, whereas this check's entire purpose is
# to be robust against a weak or careless execution model tampering
# with its own gate -- the one scenario CODEOWNERS-review-as-backstop
# does not adequately cover, since the tampering agent is the same
# session that would also need to get past review.
#
# CI topology: unlike lint.yml/idd-doctor.yml's pull_request-only
# trigger, convergence can also change WITHOUT a new push when Copilot
# submits its review (`pull_request_review`). That trigger ran directly
# on this required job before #2764 Phase 1; a same-repository PR could
# edit this file's own copy of the trigger list to control when its
# review-triggered run re-asserted, the same tamper path
# `pull_request_target` closes for pushes -- so review submissions now
# refresh the existing HEAD-associated required run from the companion
# `idd-advisory-convergence-comment.yml` workflow instead: a review
# submission reruns via `rerun-advisory-convergence --refresh-latest
# --apply` (Codex P1, PR #2855 review, after `--apply` alone turned out
# to silently skip an already-passing or budget-exhausted instance --
# see `RefreshLatestPlan`'s doc comment in `rerun-advisory-convergence.mts`),
# while review-thread *comments* keep the plain `--apply` mechanism
# they already used for a related but distinct reason (#2136): a casual
# human reply used to start this same required job, overwrite or
# cancel the SHA's verdict, and show up as "the reply got linted".
#
# Known gap vs. the issue's original three-trigger proposal:
# `pull_request_review_thread` (thread resolved/unresolved) is a real
# GitHub webhook event but is NOT one of the events GitHub Actions
# supports as an `on:` workflow trigger -- confirmed both by GitHub's
# own "events that trigger workflows" reference (which lists
# pull_request / pull_request_review / pull_request_review_comment,
# but never pull_request_review_thread) and empirically: including it
# here made this entire workflow file fail GitHub's schema validation
# (zero jobs scheduled, "workflow file issue") on first push. Residual
# gap: if a Copilot-authored thread is resolved (or reopened) via the
# "Resolve conversation" button with no accompanying comment, push, or
# fresh Copilot review, this check will not automatically re-run and
# keeps reporting its last computed verdict until one of those other
# triggers fires or a maintainer runs workflow_dispatch.
#
# workflow_dispatch (manual re-run) exists for a second reason beyond
# the thread-resolve gap above: `--assert` still exits non-zero for ANY
# not-ready verdict that survives the bounded poll described below --
# GitHub Actions has no distinct non-failing "pending" check state, so
# the check simply shows red until it converges (by design; see
# roadmap #1342's stated deadlock policy). That also means posting a
# maintainer waiver comment does NOT by itself turn a previously-failed
# check green, because a PR comment is not one of this workflow's
# trigger events and a completed run's conclusion never changes on its
# own -- a new run has to execute. workflow_dispatch gives that a
# one-click affordance instead of relying solely on the Actions UI's
# generic "re-run failed jobs".
#
# Bounded poll for the "not reviewed yet" race (#2015): the
# `pull_request`/`pull_request_target` `synchronize` trigger above
# fires the instant a push lands, well before the primary bot's own
# review typically lands (10-40s later) -- originally via the separate
# `pull_request_review` trigger this workflow declared directly; that
# trigger moved to the companion workflow in #2764 Phase 1, but the
# timing gap this poll exists for is unchanged, since the
# push-triggered run still starts immediately regardless of where the
# review's own signal now arrives from -- so a push that also needed a
# fresh review used to get asserted, and fail, before that review
# existed, costing an external rerun most of the time (the exact
# recovery documented a few paragraphs below).
# `advisory-convergence.mjs`'s CLI entry point now runs
# `runAdvisoryConvergenceWithPoll` instead of asserting
# immediately: when (and ONLY when) the verdict's sole blocking reason
# is literally "{bot} has not reviewed this pull request yet" --
# `isSoleCopilotNotReviewedYetReason` in the .mts source -- it polls a
# short, bounded window (a few seconds apart, capped around a minute,
# wall-clock bounded) before its real assert-driven exit. Every OTHER
# not-ready reason (a stale-HEAD review, unresolved threads, an
# indeterminate claim scope, a deadline/terminal-unavailability reason,
# etc.) still fails immediately on the first pass with no wait, exactly
# as before this change. This does not weaken the check's required,
# fail-closed, non-bypassable nature or change roadmap #1342's
# deterministic-convergence policy in any way: if the review still has
# not landed by the end of the window, or lands with outstanding items,
# the job fails exactly as it always has.
#
# Known residual (PR #2023 review), reshaped by #2764 Phase 1: this
# job's own concurrency group (below) is keyed by PR number ALONE
# across all three of its triggers, with `cancel-in-progress: true`.
# Originally, if the primary bot's review landed WHILE this poll was
# asleep, that submission started a fresh `pull_request_review`-triggered
# run directly in the SAME group, cancelling this run before its next
# scheduled re-check ever observed the review. `pull_request_review` no
# longer triggers this workflow directly (#2764 Phase 1 moved it to the
# companion `idd-advisory-convergence-comment.yml` workflow); a review
# submission now reaches this job only indirectly, via the companion's
# `rerun-advisory-convergence.mjs --refresh-latest --apply` (Copilot,
# PR #2855 review -- not the plain `--apply` the two comment-family
# triggers use) reissuing `gh run rerun` on an already-terminal
# instance, not by entering this concurrency group
# as a fresh trigger while a sibling is still polling. Whether a
# rerun re-entering this group while another instance is still polling
# can still cancel it is not re-derived here -- this note corrects the
# outdated trigger description without re-litigating the underlying
# race, which is the same one `#1381` documents a few paragraphs below
# (whose recovery, `rerun-advisory-convergence.mjs`, already handles a
# stale CANCELLED sibling instance, not only a FAILURE one -- see
# "Rerun mechanics" in `idd-ci.instructions.md`). See
# `runAdvisoryConvergenceWithPoll`'s own doc comment
# (`src/scripts/advisory-convergence.mts`) for the full #2015 analysis;
# no safe mechanical fix was found within that issue's scope.
#
# Correction (kurone-kito/idd-skill#1381): in practice, workflow_dispatch
# does NOT reliably flip the PR's required-check rollup for its own HEAD
# SHA, despite the "one-click affordance" framing above -- roughly a
# dozen PRs in one session each independently hit this and had to
# rediscover the real fix. Most likely cause: a manually dispatched run
# has no `pull_request` context of its own, so GitHub associates it with
# whatever ref the dispatch targets (the default branch, absent an
# explicit `--ref <pr-branch>`) rather than the PR's HEAD SHA -- this
# matches GitHub's own documented/reported behavior that a
# workflow_dispatch (or repository_dispatch) run's check-run can end up
# associated with the default branch instead of the intended branch, so
# it never surfaces in that PR's required-check rollup at all even when
# the run itself succeeds. The verified recovery is `gh run rerun
# <run-id>` on the *existing* pull_request / pull_request_target-
# triggered run for the current HEAD SHA (Copilot, PR #2855 review: this
# required workflow's own `on:` above has never included
# `pull_request_review_comment` -- that trigger belongs to the
# non-required companion `idd-advisory-convergence-comment.yml`
# instead) -- found via `gh run list --workflow=idd-advisory-convergence.yml
# --json databaseId,headSha,event,url` filtered to that exact SHA (not merely
# a run that happens to share it, and not an older run for an earlier
# HEAD on the same PR), or the Checks API -- because re-running that
# run object preserves its original pull_request-family association, so
# its fresh conclusion does update the rollup. Use the plain whole-run
# form here, not `gh run rerun --failed <run-id>`: a stale CANCELLED run
# (see the concurrency-hardening note below) has no job with a `failure`
# conclusion for `--failed` to retry, so it would silently do nothing
# and leave the stale entry in place; `--failed` stays appropriate only
# when the run has genuinely failed jobs to retry. Prefer
# this whenever an existing run for the current HEAD SHA is available to
# rerun; fall back to workflow_dispatch only when no such run exists yet
# for this HEAD (e.g. the check never triggered for it).
#
# When more than one run exists for the same HEAD SHA (the concurrency
# race below), do NOT assume the most-recently-completed run is the one
# the rollup is stuck on -- confirmed empirically (kurone-kito/idd-skill#1381,
# live during that issue's own PR #1383): the rollup can stay pinned to
# an *earlier* CANCELLED run's check-run object even after a genuinely
# later run for the identical SHA completes with SUCCESS. Identify the
# specific stuck run by matching `gh pr checks <pr-number>`'s reported
# `completedAt` for this check against `gh run list
# --workflow=idd-advisory-convergence.yml --json
# databaseId,headSha,event,conclusion,createdAt` (or the per-check-run
# `completed_at` from the Checks API) for that same HEAD SHA, then rerun
# that exact run. If the match is unclear, rerun every run for that HEAD
# SHA rather than guessing -- rerunning an already-successful run is a
# harmless no-op, but rerunning the wrong one leaves the rollup stuck.
#
# Concurrency-hardening investigation (kurone-kito/idd-skill#1381): the
# cancel-in-progress group above can cancel a legitimately in-flight run
# when a near-simultaneous review event (Copilot/CodeRabbit/Codex
# posting review comments in quick succession) fires another trigger for
# the same PR, leaving a stale CANCELLED entry that can race a later
# genuine SUCCESS in the rollup display -- directly reproduced during
# this same issue's own PR #1383: several review-triage replies fired
# five pull_request_review / pull_request_review_comment runs for one
# HEAD SHA in quick succession, and the rollup stayed on the *earliest*
# CANCELLED one even after two later runs for that identical SHA
# completed with SUCCESS, until that specific earliest run was
# individually rerun (see the recovery guidance above). No safe
# mechanical fix was identified: `cancel-in-progress: false` does not
# close this gap -- a
# concurrency group's queue slot still holds only one pending run, so a
# newer trigger unconditionally evicts (silently drops) whatever was
# already queued, reproducing the same class of stale-entry race through
# a different code path rather than eliminating it (a documented,
# still-open GitHub Actions platform limitation, not something this
# workflow's own config controls). Narrowing the concurrency group (for
# example splitting it per trigger type) would defeat the deliberate
# cross-trigger debouncing already explained in the CI-topology comment
# above, without addressing the underlying rollup-ordering race, which
# is orthogonal to how the group happens to be keyed. The operational
# recovery documented above (`gh run rerun <run-id>`) fully resolves the
# resulting stale display without a config change, so this workflow
# keeps its current concurrency configuration rather than trading it for
# an equally-racy alternative.
#
# Fail-closed on broken claim linkage under `idd-claimed` scope (#1686):
# the readiness formula this check enforces
# (`ready = scopeNotApplicable || converged || (deadline/terminal-passed
# && waived)`) previously reached `scopeNotApplicable: true` (hence
# `ready: true` with zero Copilot involvement) via THREE data-level
# paths the executing session itself controls: (2) a PR closing two
# actively-claimed issues, where disambiguation fails closed to no
# resolved claim; (3) a PR head branch that no longer matches the
# branch recorded on an active trusted claim; and (4) a claim whose
# marker history is real but no longer resolves active (a stale or
# released claim). `advisory-convergence.mts`'s `computeAdvisoryConvergenceVerdict`
# now classifies each of these as `applicability.status: "indeterminate"`
# instead of `"not_applicable"` -- a third outcome that, unlike
# `not_applicable`, NEVER satisfies `ready` through the ordinary
# convergence path; only the pre-existing deadline/terminal-plus-
# maintainer-waiver escape hatch can still clear it, and for paths 2
# and 4 no `activeClaimId` exists to bind a waiver to at all (see
# `summarizeExternalCheckWaivers`'s fail-closed-on-empty-claim-id rule,
# protocol-helpers.mts), so those two are effectively not waivable in
# practice -- only path 3 (a real, resolvable active claim) stays
# genuinely waivable.
#
# Known residual, deliberately NOT closed by #1686 (path 1): a PR body
# that omits or mangles its `Closes #N` reference yields ZERO claim
# candidates and ZERO claim-marker history for this PR -- indistinguishable,
# from this check's own evidence, from a genuine external contribution
# with no linked issue at all. Two candidate signals to force
# applicability here were considered and rejected: (a) PR-author
# membership in `trustedMarkerActors` would block a legitimate trusted
# maintainer's own manual/non-IDD PR, which this scope must not touch;
# (b) inferring a linked issue from the PR's branch name (e.g.
# `issue/1234-*`) is itself a signal the executing session fully
# controls -- it could name the branch anything, so it closes nothing a
# careless/adversarial session could not simply avoid. No signal outside
# the session's own control was found for path 1 within this issue's
# scope; it remains the honor-system layer #1341 already names as
# insufficient on its own, mitigated only by D3.5's closing-keyword
# verification (`idd-pr-submit.instructions.md`) catching a missing
# reference before merge in the ordinary IDD flow, and by CODEOWNERS
# review as the general backstop for any PR that evades it.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  # The job id is also this check's required-status-check context name
  # (see lint / idd-doctor / pnpm-boundary in the repository ruleset,
  # confirmed via `gh api repos/kurone-kito/idd-skill/rulesets/<id>`)
  # and the `ciGate.externalCheckWaivers` selector documented in
  # docs/policy-constants.md (ADVISORY_CONVERGENCE_CHECK_SELECTOR in
  # advisory-convergence.mts) -- keep all three in sync if this id ever
  # changes.
  # Adding a `name:` display-name key or changing this job id changes the
  # literal check-run context. This warning is preventive; no observed
  # incident yet. If either edit is intentional, update every rerun-helper,
  # advisory-wait, required-status-check, and external-check-waiver consumer
  # to the new literal context together.
  idd-advisory-convergence:
    runs-on: ubuntu-slim
    # No observed run history yet (new workflow). Bounds pathological
    # hangs with the same headroom as idd-doctor.yml's own estimate
    # until real durations are available to tighten this.
    timeout-minutes: 10
    # kurone-kito/idd-skill#2657 (Codex review, PR #2895): sequenced after
    # the self-waiver job below so an allowlisted PR's own bootstrap
    # marker is guaranteed to exist (posted or definitively not posted)
    # before this job ever fetches PR comments -- without this ordering,
    # the two jobs share no dependency and start in parallel, so this
    # (typically much faster) job can read comments and fail BEFORE the
    # self-waiver job finishes its diff check, claim resolution, and
    # posting call. Since posting a PR comment is not one of this
    # workflow's own trigger events, that race would leave the required
    # check red until an unrelated push or manual rerun -- defeating the
    # whole "no human click required" point of the bootstrap path.
    # `if: ${{ !cancelled() }}` overrides `needs:`'s own default (a
    # skipped dependency job skips its dependents too) -- this job must
    # still run on every trigger, including a `pull_request` run where
    # the self-waiver job's own `if:` skips it outright, and a
    # non-allowlisted PR where it runs but posts nothing.
    needs: idd-advisory-convergence-self-waiver
    if: ${{ !cancelled() }}
    # Job-level override of the workflow-level `permissions:` block above,
    # adding `actions: read` (Codex review, PR #2895): `port.getWorkflowRun`
    # (the self-referential-bootstrap-auto trust verification) calls
    # `GET /repos/{owner}/{repo}/actions/runs/{id}`, which needs this scope
    # explicitly in a private repository (an unspecified `GITHUB_TOKEN`
    # permission defaults to `none`, not inherited from the repository's
    # own default). A job-level block replaces the workflow-level one
    # entirely rather than adding to it, so every previously-granted scope
    # is repeated here too. The self-waiver job below never calls this
    # endpoint, so its own job-level permissions (unaffected by this one)
    # do not need this scope.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted default-branch checkout -- see the module-header
          # comment above. Deliberately NOT the PR head for any trigger
          # type, including workflow_dispatch. Hardcoded rather than
          # derived from github.event.repository.default_branch: this
          # source repository's default branch is main, confirmed
          # directly (git remote, branch protection target) rather than
          # relied on as an unverified event-payload field across all
          # four trigger types.
          ref: main
          fetch-depth: 1
          # Read-only check: no need to persist the token in git config.
          persist-credentials: false
      - name: Assert Node.js floor
        run: |
          # This required-check workflow relies on the runner's
          # preinstalled Node (unlike the idd-template/ mirror, which
          # pins one via actions/setup-node -- ubuntu-slim's Node is
          # already known-good for idd-doctor.yml/lint.yml, but assert
          # it explicitly here too, matching lint.yml's own Node-floor
          # guard, so a future stale runner image fails loudly instead
          # of producing a confusing helper crash -- including the
          # silent-no-op crash where a migrated CLI's
          # `if (import.meta.main)` entry guard is falsy (not an error)
          # on Node 24.0.x/24.1.x (#1447). Exact match to package.json's
          # engines.node (^22.23.2 || ^24.2.0 || >=26.0.0), including the
          # patch/minor digits, so the error message's claimed range is
          # actually what the check enforces.
          node -e '
            const versionParts = process.versions.node.split(".");
            const [major, minor, patch] = versionParts.map(Number);
            const isPrerelease = versionParts.some((part) => part.includes("-"));
            const ok =
              !isPrerelease &&
              ((major === 22 && (minor > 23 || (minor === 23 && patch >= 2))) ||
                (major === 24 && minor >= 2) ||
                major >= 26);
            if (!ok) {
              console.error(
                "Node " + process.version + " does not satisfy this " +
                "repository'"'"'s engines.node range (^22.23.2 || ^24.2.0 || >=26.0.0).",
              );
              process.exit(1);
            }
          '
      - name: Run advisory-convergence verdict (--assert)
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # workflow_dispatch's `pr_number` input is `type: number` in the
          # UI, but that constraint is not strictly enforced for direct API
          # dispatches, so route it through env: and reference it as a
          # quoted shell variable rather than interpolating the `${{ }}`
          # expression directly into the run: script.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/advisory-convergence.mjs --pr "$PR_NUMBER" --assert

  # kurone-kito/idd-skill#2657: a PR that fixes this gate's own checking
  # logic (or a handful of directly-related files) can never benefit from
  # its own fix while unmerged, because the verdict job above always runs
  # the version checked out from `main`. This job auto-posts a narrowly-
  # scoped, run-bound `idd-external-check-waiver` marker for exactly that
  # case. See docs/idd-helper-scripts.md's "External-check waiver
  # contract" (self-referential-bootstrap-auto section) for the full
  # trust model and the four acceptance conditions
  # `advisory-convergence.mts` verifies before ever honoring the marker;
  # this job's own job is only to detect the trigger and post it --
  # trust is established entirely at consume time, not here.
  #
  # `if: pull_request_target` only, never `pull_request`: during
  # kurone-kito/idd-skill#2764 Phase 1's transition window, both triggers
  # remain active on this file, so a same-repository PR editing this YAML
  # could otherwise also run this job under a `pull_request`-triggered
  # instance it fully controls. The consumer's fourth trust condition
  # (the marker's `run-id:` must resolve to a `pull_request_target`-
  # triggered run) would reject a marker from that instance anyway, but
  # gating the job itself here avoids granting `issues: write` under an
  # untrusted-YAML trigger in the first place, and avoids posting a
  # marker the consumer will only ever reject.
  idd-advisory-convergence-self-waiver:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # Narrower than the verdict job's read-only posture above: this job
    # additionally needs `pull-requests: read` (to diff and fetch the PR)
    # and `issues: write` (to post the marker, and to read the linked
    # issue's own comment stream to resolve its active claim -- the
    # PR-conversation-comment endpoint and the linked-issue-comment
    # endpoint are both gated under the Issues permission category, same
    # as the verdict job's own header comment already notes for reads).
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same trusted-default-branch rationale as the verdict job
          # above: this job's own posting logic
          # (scripts/external-check-waiver.mjs) must be the trusted copy,
          # never the PR's own -- otherwise a PR could edit that script to
          # post a differently-shaped marker or waive an unrelated check.
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Assert Node.js floor
        run: |
          node -e '
            const versionParts = process.versions.node.split(".");
            const [major, minor, patch] = versionParts.map(Number);
            const isPrerelease = versionParts.some((part) => part.includes("-"));
            const ok =
              !isPrerelease &&
              ((major === 22 && (minor > 23 || (minor === 23 && patch >= 2))) ||
                (major === 24 && minor >= 2) ||
                major >= 26);
            if (!ok) {
              console.error(
                "Node " + process.version + " does not satisfy this " +
                "repository'"'"'s engines.node range (^22.23.2 || ^24.2.0 || >=26.0.0).",
              );
              process.exit(1);
            }
          '
      - name: Detect self-referential trigger-file allowlist touch
        id: allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Kept in sync by hand with SELF_REFERENTIAL_WAIVER_TRIGGER_FILES
          # in src/scripts/advisory-convergence.mts -- exactly the same
          # seven committed paths, never derived from imports (see that
          # constant's own doc comment for why an import-derived set would
          # auto-waive most PRs).
          ALLOWLIST=(
            "src/scripts/advisory-convergence.mts"
            "src/scripts/advisory-wait-state.mts"
            "src/scripts/advisory-wait-policy.mts"
            "src/scripts/rerun-advisory-convergence.mts"
            "src/scripts/external-check-waiver.mts"
            ".github/workflows/idd-advisory-convergence.yml"
            ".github/workflows/idd-advisory-convergence-comment.yml"
          )
          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only)
          TOUCHED=false
          for FILE in "${ALLOWLIST[@]}"; do
            if grep -qxF "$FILE" <<<"$CHANGED"; then
              TOUCHED=true
              break
            fi
          done
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
      - name: Post the self-referential-bootstrap-auto waiver
        # Skip a fork PR entirely: the consumer's run-bound trust check
        # would reject it anyway (a fork's own workflow run never matches
        # this repository), so this avoids a doomed post and the API
        # calls it would cost.
        if: steps.allowlist.outputs.touched == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/external-check-waiver.mjs \
            --pr "$PR_NUMBER" \
            --check idd-advisory-convergence \
            --reason self-referential-bootstrap-auto \
            --run-id "$GITHUB_RUN_ID" \
            --auto-bootstrap \
            --apply --yes
