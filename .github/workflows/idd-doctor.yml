concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
name: IDD doctor health gate
# Repository-health gate: runs idd-doctor and fails the build on any
# idd-doctor error (config/doc/marker-prefix/required-file regressions).
# This does NOT enforce the disposable-worktree rule — a primary-worktree
# B1 violation leaves no trace in pushed history and CI checks out a
# detached HEAD, so the worktree-head check never fires here. Worktree
# enforcement is local only (idd-doctor --strict, the core.hooksPath
# hook, the cwd-vs-claim gate, and the B1 self-check).
# CI topology (#832): pull_request-only, mirroring lint.yml, so the
# health gate runs exactly once per change.
on:
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  idd-doctor:
    runs-on: ubuntu-slim
    # Observed run duration is ~10-105s (gh api .../jobs started_at/
    # completed_at); 10 min bounds pathological hangs with ~6x headroom
    # over the slowest observed run.
    timeout-minutes: 10
    steps:
      # Check out the exact commit (detached HEAD) so idd-doctor's
      # local-only primary-worktree-HEAD check never false-positives.
      # pull_request checkouts are already detached merge commits;
      # pinning the ref keeps that guaranteed even if triggers change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Fetch full history and tags: the default fetch-depth: 1
          # shallow checkout hides tag refs, so checkReleaseTagDrift's
          # `git describe --tags` (and the follow-up `rev-list` / `log`
          # calls) silently skip every run (#1286).
          fetch-depth: 0
          # Read-only health check: no need to persist the token in git config.
          persist-credentials: false
      - name: Assert Node.js floor
        # Keep the runtime guard ahead of the helper entry point; its import.meta.main check
        # silently skips on Node 24.0.x/24.1.x (#1447).
        run: |
          node --version
          node -e '
            const fs = require("fs");
            let enginesNode = "<unavailable>";
            let accepted = false;
            try {
              const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const declaredEnginesNode = manifest && manifest.engines && manifest.engines.node;
              if (typeof declaredEnginesNode !== "string") throw new Error("missing engines.node");
              enginesNode = declaredEnginesNode;
              const clauses = enginesNode.trim().split(/\s*\|\|\s*/);
              if (clauses.length < 2) throw new Error("invalid engines.node shape");
              const versions = clauses.map((clause, index) => {
                const pattern = index === clauses.length - 1
                  ? /^>=(\d+)\.(\d+)\.(\d+)$/
                  : /^\^(\d+)\.(\d+)\.(\d+)$/;
                const match = pattern.exec(clause);
                if (!match) throw new Error("invalid engines.node clause");
                const version = match.slice(1).map(Number);
                if (!version.every(Number.isSafeInteger)) throw new Error("invalid version number");
                return version;
              });
              const runtimeMatch = /^(\d+)\.(\d+)\.(\d+)$/.exec(process.versions.node);
              if (!runtimeMatch) throw new Error("invalid runtime version");
              const runtime = runtimeMatch.slice(1).map(Number);
              const compare = (left, right) => {
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] !== right[index]) return left[index] - right[index];
                }
                return 0;
              };
              accepted = versions.slice(0, -1).some((version) =>
                runtime[0] === version[0] && compare(runtime, version) >= 0
              ) || compare(runtime, versions[versions.length - 1]) >= 0;
            } catch (error) {
              accepted = false;
            }
            if (process.versions.node.includes("-")) accepted = false;
            if (!accepted) {
              console.error("Node " + process.version + " does not satisfy package.json engines.node range: " + String(enginesNode));
              process.exit(1);
            }
          '
      - name: Run idd-doctor repository-health check
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
        run: node scripts/idd-doctor.mjs --cleanup-backlog-window-days 1
