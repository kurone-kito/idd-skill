name: Pnpm boundary guard (Node 22 floor)
# #1706: the pull_request lane for pnpm-boundary.yml also covers the Node
# 22 lower bound of `engines.node`, using `.node-version`. Keep this manual
# workflow for an explicit floor-only run without starting a second copy of
# the full matrix on every pull request. A helper that only works on newer
# APIs still fails on the floor version (the #1447 failure class this guards
# against).
#
# #4993: this caller keeps the default project-check command and selects
# only the Node 22 column of the same four check groups. It is manually
# dispatched and does not add another pull-request status context.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pnpm-boundary-node22-floor:
    uses: ./.github/workflows/pnpm-boundary.yml
    with:
      # #3665: a workflow_call caller receives pnpm-boundary.yml's declared
      # input default (ubuntu-slim), whose 15-minute job cap cancelled the
      # suite, so pass the uncapped runner explicitly.
      runner: ubuntu-latest
      node-version-file: .node-version
