import:
  - '@kurone-kito/cspell-config'
cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
language: en,ja
version: '0.2'
# #3288: vendored real (and synthetic-gap) GitHub issue prose, quoted
# verbatim for the issue-body-corpus regression fixtures -- spelling in
# someone else's issue body is not this repository's own prose to fix.
# #3263: same rationale for the bot-comment corpus -- almost every entry
# is a verbatim CodeRabbit/Copilot/Codex comment body, including GitHub's
# own mid-word "…" table-cell truncation artifacts, that must stay
# byte-identical to what its cited `gh api` command re-fetches (one
# grandfathered exception, its own `note` field says so, has no fetchable
# id at all); none of this is this repository's own prose to fix.
ignorePaths:
  - tests/fixtures/issue-body-corpus/**
  - tests/fixtures/bot-comment-corpus/**
words:
  - desync
  - desynced
  - idd
  - includ
  - isort
  - Kiro
  - kurone
  - ONNX
  - octocat
  - pylint
  - pytest
  - pyproject
  - qwen
  - requir
  - TOCTOU
  - tsfile
  - undispositioned
  - unexcluded
  - unioned
  - unmigrated
  - unmirrored
  - unpushed
  - unreplied
  - unrouted
  - unscored
  - unwaived
  - Esync
  - minimizable
  - waivable
  - rollup
  - GHEC
  - GHES
  - ghinstance
  - WHATWG
  - dedented
  - dedup
  - demotability
  - deprioritize
  - dofork
  - ministral
  - nektos
  - nvmrc
  - remediations
  - ification
  - untriggerable
  - rethrew
  - resumability
  - vrchat
  - unfetched
  # #3269: fragments of real GraphQL review-thread/comment node ids
  # (PullRequestReviewThread/-Comment, base64-like opaque suffixes),
  # quoted verbatim from live kurone-kito/idd-skill PR #3160/#3154/#3196
  # data in test fixtures -- not invented words.
  - PRRC
  - PRRT
  - Wpaqs
  - Iwjk
  - xzgrt
