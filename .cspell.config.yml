import:
  - '@kurone-kito/cspell-config'
cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
language: en,ja
version: '0.2'
# #3288: vendored real (and synthetic-gap) GitHub issue prose, quoted
# verbatim for the issue-body-corpus regression fixtures -- spelling in
# someone else's issue body is not this repository's own prose to fix.
ignorePaths:
  - tests/fixtures/issue-body-corpus/**
words:
  - desync
  - desynced
  - idd
  - includ
  - isort
  - Kiro
  - kurone
  - ONNX
  - octocat
  - pylint
  - pytest
  - pyproject
  - qwen
  - requir
  - TOCTOU
  - tsfile
  - undispositioned
  - unexcluded
  - unioned
  - unmigrated
  - unmirrored
  - unpushed
  - unreplied
  - unrouted
  - unscored
  - unwaived
  - Esync
  - minimizable
  - waivable
  - rollup
  - GHEC
  - GHES
  - ghinstance
  - WHATWG
  - dedented
  - dedup
  - demotability
  - deprioritize
  - dofork
  - ministral
  - nektos
  - nvmrc
  - remediations
  - ification
  - untriggerable
  - rethrew
  - resumability
  - vrchat
  - blockedby
